<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy HQ">
<title>Fantasy Football HQ</title>
<style>
:root{
  color-scheme:dark;--bg:#050914;--surface:#0b1322;--surface2:#0e192b;--line:#1a2940;
  --text:#f5f8ff;--muted:#8fa3bd;--accent:#63e5ff;--green:#61e9a6;--amber:#ffd36e;--red:#ff7d89;
  --radius:18px
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;background:linear-gradient(180deg,#091322 0,#050914 42%,#03060c 100%);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:max(10px,env(safe-area-inset-top)) 12px calc(76px + env(safe-area-inset-bottom))
}
body[data-team="brock"]{--accent:#63e5ff}
body[data-team="quick"]{--accent:#b9a1ff}
body[data-team="highlight"]{--accent:#61e9a6}
button,a{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer}
.app{width:min(100%,430px);margin:0 auto}
.top{
  padding:14px;border:1px solid var(--line);border-radius:20px;background:var(--surface);
  box-shadow:0 10px 28px rgba(0,0,0,.24)
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kicker{font-size:9px;font-weight:900;letter-spacing:.15em;color:var(--accent)}
h1{margin:4px 0 0;font-size:22px;line-height:1.05;letter-spacing:-.035em}
.refresh{
  width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:#101d31;color:var(--text);
  font-size:19px;font-weight:800
}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:9px;color:var(--muted);font-size:9px}
.meta strong{color:#c8d7e9}
.tabs{
  position:sticky;top:max(6px,env(safe-area-inset-top));z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  gap:5px;margin:9px 0;padding:5px;border:1px solid var(--line);border-radius:15px;background:#070d18;
  box-shadow:0 8px 22px rgba(0,0,0,.24)
}
.tab{min-height:42px;border:0;border-radius:10px;background:transparent;color:#758aa6;font-size:10px;font-weight:900}
.tab.active{background:#13223a;color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.panel{
  margin:9px 0;padding:13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  box-shadow:0 8px 24px rgba(0,0,0,.2)
}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.panel-head h2{margin:0;font-size:15px;letter-spacing:-.02em}
.pill{padding:5px 7px;border-radius:999px;background:#101d31;color:var(--accent);font-size:8px;font-weight:900;letter-spacing:.08em}
.decision{
  padding:12px;border-radius:15px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,#0b1627),#0b1627);
  border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line))
}
.decision-label{font-size:8px;font-weight:900;letter-spacing:.12em;color:var(--accent)}
.decision-main{font-size:14px;font-weight:900;line-height:1.3;margin-top:4px}
.decision-sub{font-size:9px;line-height:1.4;color:var(--muted);margin-top:4px}
.primary-run{
  width:100%;min-height:44px;margin-top:10px;border:0;border-radius:11px;background:var(--accent);color:#041019;
  font-size:10px;font-weight:950;letter-spacing:.03em
}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.metric{padding:9px 10px;border-radius:13px;background:#0d192a;border:1px solid #16263d}
.metric-label{font-size:8px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.07em}
.metric-value{font-size:17px;font-weight:950;letter-spacing:-.035em;margin-top:3px}
.metric-sub{font-size:8px;color:#7388a3;margin-top:2px}
.team-grid{display:grid;gap:6px;margin-top:8px}
.team-switch{
  width:100%;min-height:50px;border:1px solid #16263d;border-radius:13px;background:#0d192a;color:inherit;
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;text-align:left
}
.team-switch strong{display:block;font-size:11px}.team-switch span{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.team-switch b{font-size:11px;text-align:right}
.action-list{display:grid;gap:7px}
.action-card{padding:10px;border-radius:14px;background:#0d192a;border:1px solid #16263d}
.action-top{display:flex;align-items:center;gap:7px}
.action-num{width:22px;height:22px;border-radius:8px;background:#14233a;color:#c6d7eb;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900}
.action-title{flex:1;font-size:11px;font-weight:900;line-height:1.25}
.badge{font-size:7px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;border-radius:999px}
.badge.now{color:#ff9da7;background:#321820}.badge.watch{color:#ffe29a;background:#2f2916}.badge.good{color:#91f3bb;background:#123020}.badge.info{color:#a9effa;background:#12303a}
.action-body{font-size:9px;line-height:1.4;color:var(--muted);margin:7px 0 0}
.run{
  width:100%;min-height:42px;margin-top:8px;border:0;border-radius:10px;background:#152945;color:#e9f4ff;
  font-size:9px;font-weight:900
}
.waiver-list{display:grid;gap:6px}
.waiver{
  display:grid;grid-template-columns:24px 1fr auto;align-items:start;gap:8px;padding:9px;border-radius:13px;background:#0d192a;border:1px solid #16263d
}
.rank{width:24px;height:24px;border-radius:8px;background:#14243b;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:950}
.waiver-name{font-size:11px;font-weight:900}.waiver-meta{font-size:8px;color:var(--muted);margin-top:2px}.waiver-why{font-size:9px;color:#a3b5ca;line-height:1.35;margin-top:4px}
.claim{font-size:7px;font-weight:900;white-space:nowrap;padding:4px 6px;border-radius:999px}.claim.use{color:#ff9da7;background:#321820}.claim.submit{color:#ffe29a;background:#2f2916}.claim.hold{color:#a9effa;background:#12303a}
.full-only{content-visibility:auto;contain-intrinsic-size:420px}
body.simple .full-only{display:none}
body.simple #issues{display:none}
body.simple #upgrades .action-card:nth-child(n+2){display:none}
body.simple #waiverList .waiver:nth-child(n+4){display:none}
body.simple .panel{margin:7px 0}
body.simple #status{padding-bottom:11px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:11px;border-radius:13px;background:#0d192a;border:1px solid #16263d}
.side.right{text-align:right}.match-team{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.match-score{font-size:21px;font-weight:950;letter-spacing:-.04em}.match-proj{font-size:8px;color:var(--muted)}.vs{font-size:8px;color:#60748f;font-weight:900}
.roster{display:grid;gap:5px}.player{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:7px;padding:7px 8px;border-radius:11px;background:#0d192a;border:1px solid #16263d}
.slot{text-align:center;padding:5px 3px;border-radius:8px;background:#14233a;color:#aebfda;font-size:7px;font-weight:900}.player.bench{opacity:.75}.player.alert{border-color:#4a3e19;background:#17170d}.pname{font-size:10px;font-weight:900}.pmeta{font-size:8px;color:var(--muted)}.pts{font-size:11px;font-weight:900}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.quick{min-height:48px;border:1px solid #16263d;border-radius:11px;background:#0d192a;color:#e3eefc;font-size:9px;font-weight:900;padding:7px}.quick span{display:block;color:var(--muted);font-size:7px;margin-top:3px}
.footer{text-align:center;color:#5f728b;font-size:8px;line-height:1.4;padding:8px 4px 0}
.dock{
  position:fixed;left:50%;transform:translateX(-50%);bottom:max(7px,env(safe-area-inset-bottom));z-index:40;
  width:min(calc(100% - 24px),406px);display:grid;grid-template-columns:1.2fr 1fr .72fr;gap:5px;padding:5px;
  border:1px solid #1b2b43;border-radius:16px;background:#070d18;box-shadow:0 10px 28px rgba(0,0,0,.42)
}
.dock button,.dock a{min-height:44px;border-radius:10px;border:0;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:9px;font-weight:950}
.dock-run{background:var(--accent);color:#041019}.dock-yahoo,.dock-mode{background:#111e31;color:#dce9f8;border:1px solid #1a2a41!important}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(68px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;z-index:60;padding:8px 11px;border-radius:999px;background:#edf8ff;color:#06101a;font-size:9px;font-weight:900;transition:.15s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.app{width:min(100%,820px)}.desktop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dock{width:406px}.metrics{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

</main>

const state={
  team:localStorage.getItem('fantasyTeam')||'all',
  mode:localStorage.getItem('fantasyMode')||'simple'
};
const REFRESH_PROMPT="Refresh my Fantasy Football HQ using live Yahoo data for Brock Hard & Tee Baggin, Quick Snap Jamison and Highlight Reel Jamison. Re-scan standings, current matchups, rosters, injury/status flags and each league's available-player pool. Then update the dashboard's status, problems, waiver queues and roster alerts.";

function metricHTML(m){return '<div class="metric"><div class="metric-label">'+m[0]+'</div><div class="metric-value">'+m[1]+'</div><div class="metric-sub">'+m[2]+'</div></div>'}
function actionHTML(x){return '<article class="action-card"><div class="action-top"><div class="action-num">'+x.n+'</div><div class="action-title">'+x.title+'</div><div class="badge '+x.state+'">'+x.state+'</div></div><div class="action-body">'+x.body+'</div><button class="run" data-run="'+encodeURIComponent(x.prompt)+'">RUN IN CHATGPT</button></article>'}
function waiverHTML(w){return '<div class="waiver"><div class="rank">'+w.r+'</div><div><div class="waiver-name">'+w.name+'</div><div class="waiver-meta">'+w.meta+'</div><div class="waiver-why">'+w.why+'</div></div><div class="claim '+w.c+'">'+w.claim+'</div></div>'}
function teamCardsHTML(cards){
  if(!cards||!cards.length)return '';
  return '<div class="team-grid">'+cards.map(c=>'<button class="team-switch" data-team="'+c.team+'"><span><strong>'+c.name+'</strong><span>'+c.meta+'</span></span><b>'+c.score+'</b></button>').join('')+'</div>'
}
function matchHTML(m){
  if(!m)return '<div class="action-body">Choose a team for matchup detail.</div>';
  return '<div class="match"><div class="side"><div class="match-team">'+m.a+'</div><div class="match-score">'+m.as+'</div><div class="match-proj">proj '+m.ap+'</div></div><div class="vs">VS</div><div class="side right"><div class="match-team">'+m.b+'</div><div class="match-score">'+m.bs+'</div><div class="match-proj">proj '+m.bp+'</div></div></div>'
}
function rosterHTML(rows){return rows.map(r=>'<div class="player '+(r[0]==='BN'?'bench ':'')+(r[4]?'alert':'')+'"><div class="slot">'+r[0]+'</div><div><div class="pname">'+r[1]+'</div><div class="pmeta">'+r[2]+'</div></div><div class="pts">'+r[3]+'</div></div>').join('')}

function render(){
  const d=DATA[state.team]||DATA.all;
  const simple=state.mode==='simple';
  document.body.classList.toggle('simple',simple);
  document.body.dataset.team=state.team;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.team===state.team));
  document.getElementById('teamContext').textContent=d.context;
  document.getElementById('statusPill').textContent=d.pill;
  document.getElementById('decisionStrip').innerHTML=
    '<div class="decision"><div class="decision-label">'+d.decision[0]+'</div><div class="decision-main">'+d.decision[1]+'</div><div class="decision-sub">'+d.decision[2]+'</div><button class="primary-run" data-run="'+encodeURIComponent(d.issues[0].prompt)+'">RUN THIS</button></div>';
  document.getElementById('metrics').innerHTML=(simple?d.metrics.slice(0,2):d.metrics).map(metricHTML).join('');
  document.getElementById('teamCards').innerHTML=state.team==='all'?teamCardsHTML(d.cards):'';
  document.getElementById('issues').innerHTML=simple?'':d.issues.slice(1).map(actionHTML).join('');
  document.getElementById('upgrades').innerHTML=(simple?d.upgrades.slice(0,1):d.upgrades).map(actionHTML).join('');
  document.getElementById('waiverList').innerHTML=(simple?d.waivers.slice(0,3):d.waivers).map(waiverHTML).join('');
  if(!simple){
    document.getElementById('match').innerHTML=matchHTML(d.match);
    document.getElementById('roster').innerHTML=rosterHTML(d.roster);
  }else{
    document.getElementById('match').textContent='';
    document.getElementById('roster').textContent='';
  }
  document.getElementById('nextPromptBtn').dataset.run=encodeURIComponent(d.issues[0].prompt);
  document.getElementById('dockYahoo').href=d.yahoo;
  document.getElementById('modeToggle').textContent=simple?'MORE':'LESS';
}
function openChat(prompt){
  showToast();
  window.location.href='https://chatgpt.com/?prompt='+encodeURIComponent(prompt);
}
function showToast(){
  const t=document.getElementById('toast');t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),850)
}
document.addEventListener('click',e=>{
  const team=e.target.closest('[data-team]');
  if(team){state.team=team.dataset.team;localStorage.setItem('fantasyTeam',state.team);render();return}
  const run=e.target.closest('[data-run]');
  if(run){openChat(decodeURIComponent(run.dataset.run||''));return}
  if(e.target.closest('#refreshBtn')){openChat(REFRESH_PROMPT);return}
  if(e.target.closest('#modeToggle')){
    state.mode=state.mode==='simple'?'full':'simple';
    localStorage.setItem('fantasyMode',state.mode);render();return
  }
});
render();
</script>
