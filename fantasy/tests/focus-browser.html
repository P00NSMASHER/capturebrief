<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brock Hard focused-four-tab acceptance</title>
<link rel="stylesheet" href="/capturebrief/fantasy/assets/styles-v2.css?v=3">
<link rel="stylesheet" href="/capturebrief/fantasy/assets/premium-v3.css?v=1">
<link rel="stylesheet" href="/capturebrief/fantasy/assets/coach-v1.css?v=2">
<link rel="stylesheet" href="/capturebrief/fantasy/assets/edge-v1.css?v=1">
<link rel="stylesheet" href="/capturebrief/fantasy/assets/strategy-v1.css?v=1">
<link rel="stylesheet" href="/capturebrief/fantasy/assets/future-v1.css?v=1">
<link rel="stylesheet" href="/capturebrief/fantasy/assets/genius-v1.css?v=1">
<link rel="stylesheet" href="/capturebrief/fantasy/assets/focus-v1.css?v=1">
</head><body><div id="root">Verifying the focused Brock experience…</div>
<script type="module">
try{
 const originalFetch=window.fetch.bind(window);
 const [raw,edge,intel]=await Promise.all([
  originalFetch('/capturebrief/fantasy/data.json').then(r=>r.json()),
  originalFetch('/capturebrief/fantasy/edge.json').then(r=>r.json()),
  originalFetch('/capturebrief/fantasy/intelligence.json').then(r=>r.json())
 ]);
 if(raw.schemaVersion!==3||Object.keys(raw.teams||{}).join(',')!=='brock'||
  String(raw.teams.brock.teamId)!=='2'||String(edge.teamId)!=='2'||String(intel.teamId)!=='2')
  throw Error('Brock-only fixture identity failed');
 const now=Date.now();
 raw.syncedAtIso=new Date(now).toISOString();
 edge.observedAtIso=new Date(now).toISOString();
 edge.yahooCapturedAtIso=new Date(now-30000).toISOString();
 edge.rosterVerifiedAtIso=new Date(now).toISOString();
 intel.capturedAtIso=new Date(now).toISOString();
 localStorage.removeItem('fantasy-hq-public-last-good-v2');
 localStorage.setItem('fantasy-hq-private-v3',JSON.stringify(raw));
 window.fetch=(url,opts)=>{
  const u=String(url);
  const json=obj=>Promise.resolve(new Response(JSON.stringify(obj),{status:200,headers:{'Content-Type':'application/json'}}));
  if(u.includes('/fantasy/edge.json?'))return json(edge);
  if(u.includes('/fantasy/intelligence.json?'))return json(intel);
  return originalFetch(url,opts);
 };
 await import('/capturebrief/fantasy/assets/app-v2.mjs?v=14');
 const until=async fn=>{for(let i=0;i<160;i++){if(fn())return true;await new Promise(r=>setTimeout(r,35))}return false};
 const tab=name=>document.querySelector('button[data-tab="'+name+'"]')?.click();
 const active=()=>document.querySelector('#tabPanel');
 const unique=()=>{
  if(active()?.querySelectorAll('.focus-panel').length!==1)throw Error('Each tab must have one focused card');
  if(active()?.querySelector('.edge-shell,.genius-panel,.coach-section'))throw Error('Obsolete stacked dashboard leaked');
 };
 if(!await until(()=>document.querySelector('#tabPanel .focus-home')))throw Error('Today did not render');
 if(document.querySelectorAll('.bottomnav button[data-tab]').length!==4)throw Error('Expected four tabs');
 if(!document.body.textContent.includes('Data source notice'))throw Error('Yahoo snapshot provenance missing');
 unique();
 if(!active().textContent.includes('Make one move that matters'))throw Error('Today decision missing');
 if(document.querySelector('.matchup-panel'))throw Error('Stale duplicate scoreboard was reintroduced');
 for(const [name,selector] of [['lineup','.focus-lineup'],['waivers','.focus-players'],['lab','.focus-league']]){
  tab(name);
  if(!await until(()=>active()?.querySelector(selector)))throw Error('Cannot navigate to '+name);
  unique();
  if(document.querySelector('button[data-tab="'+name+'"]')?.getAttribute('aria-selected')!=='true')
   throw Error('Tab selection is inaccurate for '+name);
 }
 tab('lineup');
 if(!await until(()=>active()?.querySelector('.focus-lineup')))throw Error('Lineup not rendered');
 if(!active().querySelector('.focus-roster-row'))throw Error('Yahoo captured starter and bench slots missing');
 if(!active().textContent.includes('START / SIT'))throw Error('Lineup purpose missing');
 tab('waivers');
 if(!await until(()=>active()?.querySelector('.focus-players')))throw Error('Market not rendered');
 const drawer=active().querySelector('details[data-focus-pool]');
 if(!drawer)throw Error('Yahoo-listed player inventory missing');
 drawer.open=true;
 const before=active().querySelectorAll('.focus-market-row').length;
 if(!before)throw Error('Published Yahoo player inventory unavailable');
 active().querySelector('[data-filter="WR"]')?.click();
 if(!await until(()=>active()?.querySelector('[data-filter="WR"][aria-pressed="true"]')))
  throw Error('Player-position filter is not interactive');
 if(!active().querySelector('details[data-focus-pool][open]'))throw Error('Player filter drawer collapsed');
 if(active().querySelectorAll('.focus-market-row').length>before)throw Error('WR filter increased candidate inventory');
 tab('lab');
 if(!await until(()=>active()?.querySelector('.focus-league')))throw Error('League missing');
 if(!active().textContent.includes('YAHOO RANK')&&!active().textContent.includes('ALL-PLAY RANK'))
  throw Error('League has neither verified standings nor qualified comparison');
 tab('overview');
 if(!await until(()=>active()?.querySelector('.focus-home')))throw Error('Cannot return to Today');
 const cta=active().querySelector('.focus-cta[data-tab]');
 if(cta){
  const dest=cta.dataset.tab;
  cta.click();
  if(!await until(()=>document.querySelector('button[data-tab="'+dest+'"][aria-selected="true"]')))
   throw Error('Primary decision button does not navigate');
 }
 if(document.documentElement.scrollWidth-window.innerWidth>2)throw Error('Horizontal overflow at phone width');
 if(document.body.textContent.includes('Quick Snap Jamison')||document.body.textContent.includes('Highlight Reel Jamison'))
  throw Error('Another private team leaked');
 const mark=document.createElement('strong');mark.id='focus-browser-qa';
 mark.textContent='FOCUS_BROWSER_PASS · four working screens · preserved lineup and market evidence · source notice · private scope';
 document.body.append(mark);
}catch(e){
 const mark=document.createElement('strong');mark.id='focus-browser-qa';
 mark.textContent='FOCUS_BROWSER_FAIL: '+String(e.message||e);document.body.append(mark);
}
</script></body></html>
