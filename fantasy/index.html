<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Fantasy Football HQ</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--card:#111722;--card2:#161e2b;--line:#253044;--text:#f6f8fb;--muted:#95a1b5;--accent:#7dd3fc;--good:#86efac;--warn:#fde68a;--bad:#fda4af}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}
.app{max-width:430px;margin:auto}.hero{padding:8px 4px 14px}.kicker{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}.hero h1{margin:6px 0 5px;font-size:30px;letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted);line-height:1.45}
.tabs{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:rgba(8,11,18,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.tab{border:0;border-radius:11px;padding:10px 4px;background:transparent;color:var(--muted);font-weight:800;font-size:11px}.tab.active{background:#1b2636;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.card h2{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--card2);border-radius:13px;padding:10px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.value{font-size:19px;font-weight:900;margin-top:3px}
.move{border-left:4px solid var(--good)}.move h2{color:var(--good);font-size:17px}.move p{font-size:12px;line-height:1.5;color:#d6dce6;margin:7px 0}.action{background:#0b1220;border-radius:12px;padding:10px;font-weight:800;font-size:12px;color:#dff9e9}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.side:last-child{text-align:right}.team{font-size:11px;font-weight:800}.score{font-size:24px;font-weight:900}.proj{font-size:10px;color:var(--muted)}.vs{font-size:10px;color:var(--muted);font-weight:900}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}.row:first-child{border-top:0}.slot{font-size:10px;color:var(--accent);font-weight:900}.name{font-size:12px;font-weight:800}.meta{font-size:10px;color:var(--muted)}.flag{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#2a1b22;color:var(--bad)}.pct{font-size:11px;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;color:var(--muted);font-size:9px;text-transform:uppercase;padding:0 4px 7px}.table td{padding:8px 4px;border-top:1px solid rgba(255,255,255,.06)}.me{color:var(--good);font-weight:900}
.tx{font-size:11px;line-height:1.4;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}.tx:first-child{border-top:0}.tx b{font-size:11px}.footer{text-align:center;color:var(--muted);font-size:10px;padding:12px 6px 4px;line-height:1.45}
.notice{padding:14px;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:12px}
@media(min-width:760px){.app{max-width:820px}.desktop{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
<div class="kicker">Yahoo • Week 4</div>
<h1>Fantasy Football HQ</h1>
<div class="sub" id="fresh">Loading latest published snapshot…</div>
</section>
<nav class="tabs">
<button class="tab active" data-key="brock">BROCK</button>
<button class="tab" data-key="quick">QUICK</button>
<button class="tab" data-key="highlight">HIGHLIGHT</button>
<button class="tab" id="reload">RELOAD</button>
</nav>
<div id="app"><div class="notice">Loading data.json…</div></div>
<div class="footer">Published snapshot only. Yahoo status, waivers and projections can change after publication.</div>
</main>
<script>
let DATA=null,KEY="brock";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function rosterRows(t){return t.roster.map(r=>'<div class="row"><div class="slot">'+esc(r[0])+'</div><div><div class="name">'+esc(r[1])+'</div><div class="meta">'+esc(r[2])+'</div></div>'+(r[3]?'<span class="flag">'+esc(r[3])+'</span>':'<span></span>')+'</div>').join("")}
function availRows(t){return t.available.map(r=>'<div class="row"><div class="slot">'+esc(r[1])+'</div><div><div class="name">'+esc(r[0])+'</div><div class="meta">'+esc(r[2])+(r[4]?' • '+esc(r[4]):'')+'</div></div><div class="pct">'+esc(r[3])+'%</div></div>').join("")}
function standings(t){return '<table class="table"><thead><tr><th>#</th><th>Team</th><th>Rec</th><th>PF</th><th>Wvr</th></tr></thead><tbody>'+t.standings.map(r=>'<tr class="'+(r[1]===t.name?'me':'')+'"><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>#'+esc(r[4])+'</td></tr>').join("")+'</tbody></table>'}
function txRows(t){return t.transactions.map(r=>'<div class="tx"><b>'+esc(r[0])+' • '+esc(r[1])+'</b><br>'+esc(r[2])+(r[3]?' '+esc(r[3]):'')+(r[4]?' • dropped '+esc(r[4]):'')+'</div>').join("")}
function render(){
 const t=DATA.teams[KEY],m=t.matchup;
 document.getElementById("fresh").textContent=DATA.updatedAtEt+" • "+t.name;
 document.getElementById("app").innerHTML=
 '<section class="card"><div class="grid">'+
 '<div class="stat"><div class="label">Record</div><div class="value">'+esc(t.record)+'</div></div>'+
 '<div class="stat"><div class="label">Standings</div><div class="value">'+esc(t.rank)+'/'+esc(t.leagueSize)+'</div></div>'+
 '<div class="stat"><div class="label">Waiver</div><div class="value">#'+esc(t.waiverPriority)+'</div></div>'+
 '<div class="stat"><div class="label">Points for</div><div class="value">'+esc(t.pointsFor)+'</div></div>'+
 '</div></section>'+
 '<section class="card move"><h2>'+esc(t.recommendation.headline)+'</h2><p>'+esc(t.recommendation.primary)+'</p><p>'+esc(t.recommendation.secondary)+'</p><div class="action">'+esc(t.recommendation.action)+'</div></section>'+
 '<section class="card"><h2>Week 4 matchup</h2><div class="match"><div class="side"><div class="team">'+esc(t.name)+'</div><div class="score">'+esc(m.myScore)+'</div><div class="proj">proj '+esc(m.myProjection)+'</div></div><div class="vs">VS</div><div class="side"><div class="team">'+esc(m.opponent)+'</div><div class="score">'+esc(m.oppScore)+'</div><div class="proj">proj '+esc(m.oppProjection)+'</div></div></div></section>'+
 '<div class="desktop"><section class="card"><h2>Roster + status</h2>'+rosterRows(t)+'</section><section class="card"><h2>Best available</h2>'+availRows(t)+'</section></div>'+
 '<section class="card"><h2>Standings</h2>'+standings(t)+'</section>'+
 '<section class="card"><h2>Recent league transactions</h2>'+txRows(t)+'</section>';
}
async function load(){
 try{
  const r=await fetch("./data.json?v=20260930-1002",{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  DATA=await r.json();render();
 }catch(e){
  document.getElementById("app").innerHTML='<div class="notice">Could not load the published fantasy snapshot. Reload the page.</div>';
 }
}
document.querySelectorAll(".tab[data-key]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");KEY=b.dataset.key;if(DATA)render()}));
document.getElementById("reload").addEventListener("click",()=>location.reload());
load();
</script>
</body>
</html>
