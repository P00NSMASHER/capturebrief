<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Fantasy Football Manager</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--card:#101b2b;--card2:#152338;--line:#293a53;--text:#f7f9fc;--muted:#9baac0;--accent:#67d5ff;--good:#7ee2a8;--warn:#ffd37a;--bad:#ff8fa3;--shadow:0 14px 35px rgba(0,0,0,.22)}
*{box-sizing:border-box}html{background:var(--bg);overflow-x:hidden}body{margin:0;overflow-x:hidden;background:radial-gradient(circle at 50% -20%,#132842 0,var(--bg) 38%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:0 12px max(30px,env(safe-area-inset-bottom))}.app{width:100%;max-width:920px;min-width:0;margin:auto}.app>*{min-width:0}.hero{padding:max(22px,env(safe-area-inset-top)) 4px 14px}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.hero-row{display:flex;gap:12px;align-items:end;justify-content:space-between}.hero h1{font-size:clamp(25px,7vw,38px);letter-spacing:-.045em;line-height:1;margin:7px 0 0}.fresh{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px}.team-select{display:block;width:100%;max-width:100%;min-width:0;margin:4px 0 10px;padding:12px 40px 12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:800}.nav-wrap{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;background:rgba(7,16,29,.92);backdrop-filter:blur(16px);padding:4px 0 8px}.tabs{min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:5px;border:1px solid var(--line);background:#0d1827;border-radius:15px}.tab{min-width:0;min-height:42px;border:0;border-radius:10px;padding:8px 1px;background:transparent;color:var(--muted);font-weight:900;font-size:9px;letter-spacing:0}.tab.active{background:#20324b;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}.tab:focus-visible,.team-select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.screen{min-width:0;padding-top:2px}.card{min-width:0;background:linear-gradient(145deg,var(--card),#0e1928);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}.card h2{font-size:15px;margin:0;overflow-wrap:anywhere}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.section-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:900}.decision{border-color:#315d4a;background:linear-gradient(145deg,#12271f,#0f1e1c)}.decision-tag{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:900}.decision h2{font-size:22px;line-height:1.12;letter-spacing:-.025em;margin:9px 0}.decision p{font-size:12px;line-height:1.55;color:#dbe4ee;margin:8px 0}.next-step{margin-top:13px;padding:12px;border-radius:12px;background:#07150f;border:1px solid #294d3d;color:#e6fff0;font-size:12px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0}.metric{min-width:0;background:var(--card2);border:1px solid rgba(255,255,255,.04);border-radius:13px;padding:11px}.metric:last-child{grid-column:1/-1}.metric .label{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900}.metric .value{font-size:18px;font-weight:950;margin-top:4px;white-space:nowrap}.metric .hint{font-size:9px;color:var(--muted);margin-top:3px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.watch{display:grid;gap:7px}.watch-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--card2);border-radius:12px;padding:11px}.watch-name{font-size:12px;font-weight:850}.watch-meta{font-size:10px;color:var(--muted);margin-top:3px}.badge{font-size:10px;font-weight:950;padding:5px 8px;border-radius:999px;background:#39212a;color:var(--bad)}.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:9px;align-items:center}.side:last-child{text-align:right}.team{font-size:11px;font-weight:850}.score{font-size:25px;font-weight:950}.proj{font-size:10px;color:var(--muted)}.vs{font-size:9px;color:var(--muted);font-weight:950}.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}.row:first-child{border-top:0}.slot{font-size:10px;color:var(--accent);font-weight:950}.name{font-size:12px;font-weight:850}.meta{font-size:10px;color:var(--muted);margin-top:2px}.pct{font-size:11px;color:var(--muted);text-align:right}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:360px}.table th{text-align:left;color:var(--muted);font-size:9px;text-transform:uppercase;padding:0 5px 8px}.table td{padding:9px 5px;border-top:1px solid rgba(255,255,255,.07)}.me{color:var(--good);font-weight:900}.tx{font-size:11px;line-height:1.45;padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}.tx:first-child{border-top:0}.empty,.notice{padding:15px;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:12px}.context{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.details{padding:0;overflow:hidden}.details summary{cursor:pointer;list-style:none;padding:15px;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:space-between}.details summary::-webkit-details-marker{display:none}.details summary:after{content:"+";font-size:18px;color:var(--accent)}.details[open] summary:after{content:"–"}.details-body{padding:0 15px 15px}.footer{text-align:center;color:var(--muted);font-size:10px;padding:14px 8px 4px;line-height:1.5}.desktop-grid{display:grid;gap:10px}.reload{border:0;background:transparent;color:var(--accent);font:inherit;font-size:11px;font-weight:900;padding:7px;cursor:pointer}
@media(min-width:760px){body{padding-left:20px;padding-right:20px}.desktop-grid{grid-template-columns:1.2fr .8fr}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric:last-child{grid-column:auto}.tab{font-size:10px;letter-spacing:.02em}.hero{padding-top:32px}.screen{min-height:500px}}
@media(prefers-reduced-motion:no-preference){.screen{animation:enter .18s ease-out}@keyframes enter{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="app">
<header class="hero">
  <div class="eyebrow" id="league-label">Yahoo fantasy</div>
  <div class="hero-row"><h1>Manager HQ</h1><button class="reload" id="reload" type="button">REFRESH</button></div>
  <div class="fresh" id="fresh" aria-live="polite">Loading the latest published snapshot…</div>
</header>
<div class="nav-wrap">
  <label class="section-label" for="team-select">Managing</label>
  <select class="team-select" id="team-select" aria-label="Choose fantasy team"></select>
  <nav class="tabs" aria-label="Manager sections">
    <button class="tab active" data-view="now" type="button">DO NOW</button>
    <button class="tab" data-view="lineup" type="button">LINEUP</button>
    <button class="tab" data-view="waivers" type="button">WAIVERS</button>
    <button class="tab" data-view="league" type="button">LEAGUE</button>
  </nav>
</div>
<div id="app"><div class="notice">Loading fantasy data…</div></div>
<div class="footer">Decision support from a published read-only snapshot. Verify late news and availability in Yahoo before acting.</div>
</main>
<script>
let DATA=null,KEY="brock",VIEW="now";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const statusTone=s=>/IR|OUT|O$/i.test(s||"")?"bad":"warn";
function metric(label,value,hint="",tone=""){return '<div class="metric"><div class="label">'+esc(label)+'</div><div class="value '+tone+'">'+esc(value)+'</div>'+(hint?'<div class="hint">'+esc(hint)+'</div>':'')+'</div>'}
function rosterRows(t){return t.roster.map(r=>'<div class="row"><div class="slot">'+esc(r[0])+'</div><div><div class="name">'+esc(r[1])+'</div><div class="meta">'+esc(r[2])+'</div></div>'+(r[3]?'<span class="badge '+statusTone(r[3])+'">'+esc(r[3])+'</span>':'<span></span>')+'</div>').join("")}
function availableRows(t){return t.available.map(r=>'<div class="row"><div class="slot">'+esc(r[1])+'</div><div><div class="name">'+esc(r[0])+'</div><div class="meta">'+esc(r[2])+(r[4]?' · '+esc(r[4]):'')+'</div></div><div class="pct">'+esc(r[3])+'% rostered</div></div>').join("")}
function standings(t){return '<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Team</th><th>Record</th><th>PF</th><th>Waiver</th></tr></thead><tbody>'+t.standings.map(r=>'<tr class="'+(r[1]===t.name?'me':'')+'"><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>#'+esc(r[4])+'</td></tr>').join("")+'</tbody></table></div>'}
function transactions(t){return t.transactions.map(r=>'<div class="tx"><b>'+esc(r[0])+' · '+esc(r[1])+'</b><br>'+esc(r[2])+(r[3]?' '+esc(r[3]):'')+(r[4]?' · dropped '+esc(r[4]):'')+'</div>').join("")}
function watchList(t){if(!t.statusFlags?.length)return '<div class="empty">No injury or roster-status alerts in this snapshot.</div>';return '<div class="watch">'+t.statusFlags.map(x=>'<div class="watch-item"><div><div class="watch-name">'+esc(x.player)+'</div><div class="watch-meta">'+esc(x.slot)+' · verify status before lineup lock</div></div><span class="badge '+statusTone(x.status)+'">'+esc(x.status)+'</span></div>').join("")+'</div>'}
function matchup(t){const m=t.matchup;return '<section class="card"><div class="card-head"><h2>Matchup</h2><span class="section-label">Week '+esc(DATA.week)+'</span></div><div class="match"><div class="side"><div class="team">'+esc(t.name)+'</div><div class="score">'+esc(m.myScore)+'</div><div class="proj">projected '+esc(m.myProjection)+'</div></div><div class="vs">VS</div><div class="side"><div class="team">'+esc(m.opponent)+'</div><div class="score">'+esc(m.oppScore)+'</div><div class="proj">projected '+esc(m.oppProjection)+'</div></div></div></section>'}
function nowView(t){const edge=(Number(t.matchup.myProjection)-Number(t.matchup.oppProjection)).toFixed(1),edgeTone=Number(edge)>=0?"good":"bad";return '<div class="screen"><section class="card decision"><div class="decision-tag">● Next best action</div><h2>'+esc(t.recommendation.headline)+'</h2><p>'+esc(t.recommendation.primary)+'</p><details><summary class="context">Why this is the recommendation</summary><p>'+esc(t.recommendation.secondary)+'</p></details><div class="next-step">'+esc(t.recommendation.action)+'</div></section><div class="metrics">'+metric("Projected edge",(Number(edge)>0?"+":"")+edge,"vs. this opponent",edgeTone)+metric("Waiver priority","#"+t.waiverPriority,"preserve unless upgraded")+metric("Record",t.record,"rank "+t.rank+" of "+t.leagueSize)+'</div><div class="desktop-grid"><section class="card"><div class="card-head"><h2>Needs attention</h2><span class="section-label">'+esc(t.statusFlags?.length||0)+' alerts</span></div>'+watchList(t)+'</section>'+matchup(t)+'</div></div>'}
function lineupView(t){return '<div class="screen"><section class="card"><div class="card-head"><h2>Current Yahoo lineup</h2><span class="section-label">Check alerts</span></div><p class="context">Your published roster, grouped by Yahoo slot. The manager recommendation appears only when it affects a lineup choice.</p>'+rosterRows(t)+'</section><details class="card details"><summary>Lineup decision context</summary><div class="details-body"><p class="context">'+esc(t.recommendation.action)+'</p></div></details></div>'}
function waiverView(t){return '<div class="screen"><section class="card decision"><div class="decision-tag">Waiver plan · priority #'+esc(t.waiverPriority)+'</div><h2>'+esc(t.recommendation.headline)+'</h2><div class="next-step">'+esc(t.recommendation.action)+'</div></section><section class="card"><div class="card-head"><h2>Available players</h2><span class="section-label">Yahoo snapshot</span></div><p class="context">Availability and roster percentages can change. A player being listed here is not itself a recommendation to make a claim.</p>'+availableRows(t)+'</section></div>'}
function leagueView(t){return '<div class="screen"><section class="card"><div class="card-head"><h2>League standings</h2><span class="section-label">'+esc(t.leagueName)+'</span></div>'+standings(t)+'</section><details class="card details"><summary>Recent league transactions</summary><div class="details-body">'+transactions(t)+'</div></details></div>'}
function render(){const t=DATA.teams[KEY];document.getElementById("fresh").textContent=DATA.updatedAtEt+' · Week '+DATA.week;document.getElementById("league-label").textContent=DATA.provider+' · '+t.leagueName;document.getElementById("app").innerHTML=VIEW==="lineup"?lineupView(t):VIEW==="waivers"?waiverView(t):VIEW==="league"?leagueView(t):nowView(t)}
function setupTeams(){const select=document.getElementById("team-select");select.innerHTML=Object.entries(DATA.teams).map(([key,t])=>'<option value="'+esc(key)+'">'+esc(t.name)+'</option>').join("");if(!DATA.teams[KEY])KEY=Object.keys(DATA.teams)[0];select.value=KEY;select.addEventListener("change",()=>{KEY=select.value;render()})}
async function load(){try{const r=await fetch('./data.json?ts='+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error('HTTP '+r.status);DATA=await r.json();setupTeams();render()}catch(e){document.getElementById("app").innerHTML='<div class="notice">Could not load the published fantasy snapshot. Refresh the page to try again.</div>';document.getElementById("fresh").textContent="Snapshot unavailable"}}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");VIEW=b.dataset.view;if(DATA)render()}));
document.getElementById("reload").addEventListener("click",load);
load();
</script>
</body>
</html>
