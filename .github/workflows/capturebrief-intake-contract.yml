name: CaptureBrief website-to-core intake contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - capturebrief_core/request_draft.py
      - capturebrief_core/free_trial.py
      - capturebrief_core/intake.py
      - capturebrief_core/payment_reconciliation.py
      - scripts/qa_browser_to_core_intake.py
      - scripts/qa_request_contract.py
      - .github/workflows/capturebrief-intake-contract.yml
  push:
    branches: [main]
    paths:
      - capturebrief_core/request_draft.py
      - capturebrief_core/free_trial.py
      - capturebrief_core/intake.py
      - capturebrief_core/payment_reconciliation.py
      - scripts/qa_browser_to_core_intake.py
      - scripts/qa_request_contract.py
      - .github/workflows/capturebrief-intake-contract.yml

# Actual website JS with actual core parser and fictional test inputs only.
# No customer sends, billing, source promotion or deployment.
permissions:
  contents: read

concurrency:
  group: intake-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_CHECKOUT: site-candidate
      PAYMENT_CHECKOUT: .
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out core candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out immutable three-mode website candidate (PR 83)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: P00NSMASHER/capturebrief
          ref: 41d6c563dd4c2cdbb3eedb2dcd13ae0a4828e40e
          path: site-candidate
          persist-credentials: false
      - name: Reject mismatched website source
        run: test "$(git -C site-candidate rev-parse HEAD)" = "41d6c563dd4c2cdbb3eedb2dcd13ae0a4828e40e"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - name: Exercise actual shipped JavaScript drafts through Python core
        run: python scripts/qa_request_contract.py
      - name: Install fixed Playwright tool version
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify rendered Chromium and WebKit draft and fictional payment boundaries
        run: python scripts/qa_browser_to_core_intake.py
