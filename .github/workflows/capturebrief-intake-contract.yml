name: CaptureBrief website-to-core intake contract

on:
  push:
    branches:
      - feat/pilot-email-intake-bridge-20261018
    paths:
      - scripts/qa_browser_to_core_intake.py
      - .github/workflows/capturebrief-intake-contract.yml

# This is only a test of two independent PR candidate commits.
# Nothing in this workflow sends an email, bills Stripe, deploys,
# imports private cases, or changes production/gh-pages.
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_CHECKOUT: site-candidate
      PAYMENT_CHECKOUT: payment-candidate
      PYTHONPATH: "."
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out core candidate (PR 52)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable website candidate (PR 50)
        uses: actions/checkout@v4
        with:
          repository: P00NSMASHER/capturebrief
          ref: 2f5af397fc5d46e6f919f11b0f6e3701df69c665
          path: site-candidate
          persist-credentials: false
      - name: Check out immutable payment candidate (PR 55)
        uses: actions/checkout@v4
        with:
          repository: P00NSMASHER/capturebrief
          ref: bbbac444705b0a95ea4af12430c287a984b427ee
          path: payment-candidate
          persist-credentials: false
      - name: Reject mismatched website or payment candidate refs
        run: |
          set -euo pipefail
          test "$(git -C site-candidate rev-parse HEAD)" = "2f5af397fc5d46e6f919f11b0f6e3701df69c665"
          test "$(git -C payment-candidate rev-parse HEAD)" = "bbbac444705b0a95ea4af12430c287a984b427ee"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed Playwright tool version
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify Chromium and WebKit draft, core case and fictional Stripe acceptance gate
        run: python scripts/qa_browser_to_core_intake.py
