name: CaptureBrief fictional independent-runner encrypted restore

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/capturebrief-crossrunner-fictional.yml'
      - 'scripts/qa_full_case_cross_runner.py'
      - 'scripts/full_case_backup.py'
      - 'tests/test_full_case_backup.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/capturebrief-crossrunner-fictional.yml'
      - 'scripts/qa_full_case_cross_runner.py'
      - 'scripts/full_case_backup.py'
      - 'tests/test_full_case_backup.py'

permissions:
  contents: read

jobs:
  fictional-full-case-producer:
    name: Produce fictional encrypted original / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned local crypto
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Produce bounded fictional AES-GCM original, no live data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_full_case_cross_runner.py produce --artifact-dir "$RUNNER_TEMP/capturebrief-crossrunner-fictional"
      - name: Transfer only ciphertext and content-digest manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capturebrief-fictional-crossrunner-${{ github.sha }}
          path: ${{ runner.temp }}/capturebrief-crossrunner-fictional/
          if-no-files-found: error
          retention-days: 1

