name: CaptureBrief SAM automation URL raw-source integrity QA

on:
  pull_request:
    paths:
      - 'capturebrief_core/source_policy.py'
      - 'tests/test_source_url_raw_policy.py'
      - '.github/workflows/capturebrief-sam-url-raw-policy-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-sam-source-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run raw-URL negative and first-party positive controls (no network)
        run: python -m unittest tests.test_source_url_raw_policy -v
