name: CaptureBrief current SAM access observation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/verify_sam_current_access.py
      - tests/test_verify_sam_current_access.py
      - .github/workflows/capturebrief-sam-current-access.yml
  push:
    branches: [main]
    paths:
      - scripts/verify_sam_current_access.py
      - tests/test_verify_sam_current_access.py
      - .github/workflows/capturebrief-sam-current-access.yml

permissions:
  contents: read

concurrency:
  group: sam-current-access-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_verify_sam_current_access -v

  current-public-observation:
    needs: contract
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify immutable main observation source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Observe one real public solicitation without retaining its raw response
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/verify_sam_current_access.py > sam-current-access.json
      - name: Report only the bounded observation outcome
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('sam-current-access.json')
          if path.is_file():
              receipt = json.loads(path.read_text())
              keys = ('status', 'api_key_present_in_runtime', 'api_access_verified',
                      'latest_active_observation_verified', 'external_send_authorized')
              print(json.dumps({key: receipt[key] for key in keys}, sort_keys=True))
          PY
      - name: Retain only the redacted access receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sam-current-access-${{ github.sha }}-${{ github.run_id }}
          path: sam-current-access.json
          if-no-files-found: error
          retention-days: 7
