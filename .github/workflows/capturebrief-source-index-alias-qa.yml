name: CaptureBrief source-index alias boundary (exact-head Linux and Windows)
on:
  pull_request:
    paths:
      - scripts/source_coverage_audit.py
      - tests/test_source_coverage_audit.py
      - .github/workflows/capturebrief-source-index-alias-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-original-provenance:
    name: Source original provenance / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact proposed head, not synthetic merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require tested revision equals head
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Use Python 3.11 on both operating systems
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Confirm read-only private-index source boundary
        run: python -m unittest tests.test_source_coverage_audit -v
