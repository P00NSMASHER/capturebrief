name: CaptureBrief free-check reservation chronology (Linux + Windows)

on:
  pull_request:
    paths:
      - 'capturebrief_core/free_trial.py'
      - 'tests/test_free_trial.py'
      - '.github/workflows/free-check-reservation-chronology-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  point-of-use-reservation:
    name: Exact-head chronology red/green / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact PR revision, no persisted Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile reservation code and synthetic tests
        run: python -m compileall -q capturebrief_core/free_trial.py tests/test_free_trial.py
      - name: Reproduce rejection plus valid no-card reservations without network
        run: >-
          python -m unittest
          tests.test_free_trial.FreeTrialTests.test_inspection_rejects_false_reservation_chronology
          tests.test_free_trial.FreeTrialTests.test_private_registration_is_no_charge_idempotent_and_redacted
          tests.test_free_trial.FreeTrialTests.test_existing_technical_fixture_builds_one_result_without_watch_or_charge
          -v
