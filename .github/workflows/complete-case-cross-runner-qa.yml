name: CaptureBrief complete-case encrypted cross-runner rehearsal (fictional only)

on:
  pull_request:
    paths:
      - scripts/full_case_backup.py
      - tests/test_full_case_backup.py
      - .github/workflows/complete-case-cross-runner-qa.yml
  push:
    branches: [main]
    paths:
      - scripts/full_case_backup.py
      - tests/test_full_case_backup.py
      - .github/workflows/complete-case-cross-runner-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capturebrief-complete-case-cross-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fictional-encrypted-snapshot-linux:
    if: github.repository == 'P00NSMASHER/capturebrief'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned released cryptography
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Build complete fictional case and encrypt using actual source code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          from tests.test_full_case_backup import FullCaseBackupTests
          fixture=FullCaseBackupTests("test_entire_case_backup_encrypts_all_required_kinds_and_restores_exact_bytes")
          fixture.setUp()
          try:
              info=fixture.create()
              assert info["file_count"]==len(fixture.entries)>=13
              assert info["independent_restore_verified"] is False
              assert info["customer_release_authorized"] is False
              assert info["external_send_authorized"] is False
              directory=Path(os.environ["RUNNER_TEMP"])/"fictional-encrypted-only"
              directory.mkdir(mode=0o700)
              original=fixture.archive.read_bytes()
              (directory/"fictional-complete-case.cbak").write_bytes(original)
              expected={
                  "schema":"capturebrief-cross-runner-fictional-only-v1",
                  "backup_sha256":hashlib.sha256(original).hexdigest(),
                  "file_count":len(fixture.entries),
                  "files":fixture.entries,
                  "real_customer":False,
                  "production_key_custody_proven":False,
                  "offdevice_production_restore_proven":False,
                  "external_send_authorized":False,
              }
              (directory/"independent-expected-hashes.json").write_text(
                  json.dumps(expected,sort_keys=True,indent=2)+"\n")
              print("FICTIONAL_13_KIND_CASE_ENCRYPTED_NO_CUSTOMER_OR_KEY_CUSTODY_CLAIM")
          finally:
              fixture.doCleanups()
          PY
      - name: Upload ONLY encrypted fictional case and SHA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capturebrief-fictional-encrypted-cross-runner-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fictional-encrypted-only/fictional-complete-case.cbak
            ${{ runner.temp }}/fictional-encrypted-only/independent-expected-hashes.json
          retention-days: 2
          if-no-files-found: error

  independent-windows-restore:
    needs: fictional-encrypted-snapshot-linux
    if: github.repository == 'P00NSMASHER/capturebrief'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install same pinned cryptography library on independent OS/runner
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Download encrypted **fictional-only** artifact
        uses: actions/download-artifact@v4
        with:
          name: capturebrief-fictional-encrypted-cross-runner-${{ github.sha }}
          path: ${{ runner.temp }}/retrieved-fake-bundle
      - name: Verify independent receipt, decrypt and exact-restore all fictional source kinds
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os
          from tests.test_full_case_backup import TEST_KEY, KINDS
          from scripts.full_case_backup import verify_complete_backup,restore_complete_backup
          folder=Path(os.environ["RUNNER_TEMP"])/"retrieved-fake-bundle"
          receipt=json.loads((folder/"independent-expected-hashes.json").read_text())
          original=folder/"fictional-complete-case.cbak"
          if receipt.get("schema")!="capturebrief-cross-runner-fictional-only-v1":
              raise SystemExit("Unrecognized independent test receipt")
          if hashlib.sha256(original.read_bytes()).hexdigest()!=receipt["backup_sha256"]:
              raise SystemExit("Encrypted source bytes changed during artifact transfer")
          if receipt["real_customer"] is not False or receipt["production_key_custody_proven"] is not False:
              raise SystemExit("Production custody must not be inferred from a TEST key")
          verified=verify_complete_backup(original,TEST_KEY)
          restored=restore_complete_backup(
              original,Path(os.environ["RUNNER_TEMP"])/"restored-fake-new-directory",TEST_KEY
          )
          if not verified["file_count"]==restored["file_count"]==receipt["file_count"]==len(KINDS):
              raise SystemExit("Original/restored inventory sizes differ")
          dest=Path(os.environ["RUNNER_TEMP"])/"restored-fake-new-directory"
          for row in receipt["files"]:
              f=dest.joinpath(*row["path"].split("/"))
              if not f.is_file() or hashlib.sha256(f.read_bytes()).hexdigest()!=row["sha256"]:
                  raise SystemExit("Cross-runner source original rehash failed")
              if restored["restored_files"].get(row["id"])!=row["sha256"]:
                  raise SystemExit("Authenticated restore manifest mismatch")
          for key in ("independent_offdevice_restore_proven","customer_release_authorized",
                      "external_send_authorized"):
              if restored.get(key) is not False:
                  raise SystemExit("TEST restore cannot assert external release")
          assert verified["offdevice_restore_proven"] is False
          print(json.dumps({
              "status":"FICTIONAL_CROSS_RUNNER_COMPLETE_CASE_EXACT_RESTORE_PASSED",
              "originals":len(receipt["files"]),
              "source_sha_verified":True,
              "linux_to_windows":True,
              "production_key_custody_proven":False,
              "real_offdevice_customer_restore_proven":False,
              "customer_release_authorized":False,
              "external_send_authorized":False
          },sort_keys=True))
          '@ | python -
