name: CaptureBrief fictional encrypted case cross-runner verification

on:
  pull_request:
    paths:
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_full_case_cross_runner.py'
      - 'tests/test_full_case_backup.py'
      - '.github/workflows/complete-case-cross-runner-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_full_case_cross_runner.py'
      - 'tests/test_full_case_backup.py'
      - '.github/workflows/complete-case-cross-runner-qa.yml'

permissions:
  contents: read

jobs:
  encrypt-linux:
    name: Produce encrypted fictional 13-original case (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact proposed case-backup code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use pinned release-test Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned cryptography library
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Produce only encrypted fictional test data
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/capturebrief-fake-only"
          python -m compileall -q scripts/qa_full_case_cross_runner.py
          python scripts/qa_full_case_cross_runner.py produce --artifact-dir "$RUNNER_TEMP/capturebrief-fake-only"
      - name: Upload fictional ciphertext and independent SHA expectations only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capturebrief-fictional-encrypted
          path: |
            ${{ runner.temp }}/capturebrief-fake-only/fictional-complete-case.cbak
            ${{ runner.temp }}/capturebrief-fake-only/fictional-ciphertext-sha256.json
          retention-days: 2
          if-no-files-found: error

  restore-windows:
    name: Independently rehash and restore ciphertext (Windows)
    needs: encrypt-linux
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed case-backup code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use pinned release-test Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned cryptography library
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Retrieve encrypted fictional case only to independent runner
        uses: actions/download-artifact@v4
        with:
          name: capturebrief-fictional-encrypted
          path: ${{ runner.temp }}/cb-fictional-ciphertext
      - name: Validate earlier ciphertext SHA and independently restore all originals
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/qa_full_case_cross_runner.py consume --artifact-dir "${{ runner.temp }}/cb-fictional-ciphertext" --restore-dir "${{ runner.temp }}/cb-independent-restore"
