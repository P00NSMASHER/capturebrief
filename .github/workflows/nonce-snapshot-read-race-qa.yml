name: CaptureBrief nonce snapshot read-race regression

on:
  pull_request:
    paths:
      - 'scripts/snapshot_authorization_ledger.py'
      - 'tests/test_authorization_ledger_snapshot.py'
      - '.github/workflows/nonce-snapshot-read-race-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/snapshot_authorization_ledger.py'
      - 'tests/test_authorization_ledger_snapshot.py'
      - '.github/workflows/nonce-snapshot-read-race-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-race-test:
    name: Independent offline SQLite race QA / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact PR head, never a synthetic merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert the exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile private one-use ledger snapshot verifier
        run: python -m compileall -q scripts/snapshot_authorization_ledger.py capturebrief_core/authorization_ledger.py
      - name: Run adversarial, fictional-only nonce snapshot tests
        run: python -m unittest tests.test_authorization_ledger_snapshot -v
