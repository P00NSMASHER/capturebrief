name: CaptureBrief FY2027 official signed transport E2E (no publish)

on:
  push:
    branches:
      - fix/source-policy-secret-redaction-20261018
    paths:
      - ".github/workflows/capturebrief-sam-signed-transport-e2e.yml"
      - "scripts/retain_fy2027_candidate.py"
      - "capturebrief_core/source_policy.py"
      - "tests/test_retain_fy2027_candidate.py"

permissions:
  contents: read

jobs:
  live-public-fy2027-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Obtain exact public source through guarded real SAM route and verify hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.retain_fy2027_candidate import retain_exact_fy2027
          from capturebrief_core.history_index import download_extract_to_file
          from capturebrief_core.data_services import ARCHIVE_DOWNLOAD
          dest = Path(os.environ["RUNNER_TEMP"]) / "capturebrief-test-retention"
          try:
              result = retain_exact_fy2027(dest)
              print(json.dumps({"operator_retention_status":result["status"],
                                "source_digest":result["sha256"],
                                "bytes":result["bytes"],
                                "catalog_approved":False}))
          except Exception as exc:
              reason = str(exc)
              code = (
                  "DIFFERENT_FROM_PREVIOUSLY_VERIFIED_SHA" if "original changed" in reason
                  else "PRIVATE_ROOT_ERROR" if "private" in reason.lower()
                  else "ATOMIC_RETENTION_ERROR" if "artifact" in reason or "retained" in reason
                  else "UNCLASSIFIED_SAFE_FAILURE"
              )
              print(json.dumps({"operator_retention_status":"BLOCKED",
                                "exception_type":type(exc).__name__,
                                "reason_code":code,
                                "approved_to_update_catalog":False}))
              # Separately observe the current exact public SAM object bytes
              # without storing its presigned redirect, uploading, or approving.
              source = dest.parent / "diagnostic-public-fy2027.csv"
              try:
                  r = download_extract_to_file(source,
                      source_url=ARCHIVE_DOWNLOAD.format(fy=2027),
                      max_bytes=2000000, timeout=40)
                  print(json.dumps({"live_public_original_bytes":r["size_bytes"],
                       "live_public_original_sha256":r["sha256"],
                       "final_host_only":r["final_delivery_host"],
                       "matches_prior_verified_original":r["sha256"] ==
                        "7b4e00e3156248db9dcca767431bb6c5d4168aeeb2abc707ab12c0f9e61d71ce",
                       "human_review_complete":False}))
              except Exception as further:
                  print(json.dumps({"diagnostic_status":"SOURCE_FETCH_UNAVAILABLE",
                       "reason_type":type(further).__name__}))
              raise SystemExit(2)
          PY
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "capturebrief-test-retention"
          expected = "7b4e00e3156248db9dcca767431bb6c5d4168aeeb2abc707ab12c0f9e61d71ce"
          original = root / f"FY2027-{expected}.csv"
          receipts = list(root.glob("*.receipt.json"))
          assert original.is_file() and original.stat().st_size == 1607260
          assert hashlib.sha256(original.read_bytes()).hexdigest() == expected
          assert len(receipts) == 1
          receipt = json.loads(receipts[0].read_text(encoding="utf-8"))
          assert receipt["downloaded_sha256"] == expected
          assert receipt["official_delivery_host"] in {"falextracts.s3.amazonaws.com", "s3.amazonaws.com"}
          assert receipt["catalog_approved"] is False
          assert receipt["human_source_review_complete"] is False
          assert receipt["case_release_authorized"] is False
          assert receipt["external_send_authorized"] is False
          print(json.dumps({"actual_sam_route": "OFFICIAL_SIGNED_TRANSPORT_ACCEPTED",
              "original_sha256": expected, "original_bytes": 1607260,
              "source_transport_host": receipt["official_delivery_host"],
              "original_retained_only_ephemerally": True, "customer_release_authorized": False}))
          PY
          # No artifact upload, no customer content, no catalog update.
