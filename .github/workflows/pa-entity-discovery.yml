name: PA x402 legacy contract regression

on:
  pull_request:
    paths:
      - ".nojekyll"
      - "netlify-build.sh"
      - "netlify.toml"
      - "netlify/functions/**"
      - "x402/pa-entity/**"
      - "tests/pa-entity-discovery.test.mjs"
      - "tests/pa-entity-proxy.test.mjs"
      - "tests/pa-entity-workflow-policy.test.mjs"
      - ".github/workflows/pa-entity-discovery.yml"
  push:
    branches:
      - main
    paths:
      - ".nojekyll"
      - "netlify-build.sh"
      - "netlify.toml"
      - "netlify/functions/**"
      - "x402/pa-entity/**"
      - "tests/pa-entity-discovery.test.mjs"
      - "tests/pa-entity-proxy.test.mjs"
      - "tests/pa-entity-workflow-policy.test.mjs"
      - ".github/workflows/pa-entity-discovery.yml"

permissions:
  contents: read

# Offline compatibility coverage only. Current paid-service discovery belongs to
# P00NSMASHER/x402-product-factory; CaptureBrief's website is GitHub Pages.
# A pass here does not certify live discovery, payment, settlement or fulfillment.
jobs:
  validate-static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate legacy PA x402 offline contracts
        run: |
          node tests/pa-entity-discovery.test.mjs
          node tests/pa-entity-proxy.test.mjs
          node tests/pa-entity-workflow-policy.test.mjs
