name: CaptureBrief private payment-hold integrity regression

on:
  pull_request:
    paths:
      - 'capturebrief_core/private_order_registry.py'
      - 'scripts/inspect_private_order_fulfillment.py'
      - 'tests/test_payment_hold_integrity.py'
      - '.github/workflows/capturebrief-payment-hold-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-order-hold-binding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact pull-request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile changed modules and test
        run: python -m compileall -q capturebrief_core/private_order_registry.py scripts/inspect_private_order_fulfillment.py tests/test_payment_hold_integrity.py
      - name: Reproduce private SQLite hold-integrity red/green without provider calls
        run: python -m unittest tests.test_payment_hold_integrity -v
