name: Product Core
on:
  push:
    paths: ['capturebrief_core/**','tests/**','fixtures/**','scripts/**','assets/**','netlify-build.sh','netlify.toml','.github/workflows/product-core.yml','PRODUCT-CORE.md','DECISION-EVIDENCE.md','RULE-SOURCES.md','RULE-SOURCE-CATALOG.json','SOURCE-POLICY.md','ARCHIVE-CATALOG.md','REFERENCE-REVIEW.md','OUTCOME-LEDGER.md','BUSINESS-MODEL-v7.md','CALIBRATION-PROTOCOL.md','OUTBOUND-COMMUNICATIONS.md','PUBLIC-RELEASE.md','RELEASE-CONSISTENCY.md','DELIVERY-VERIFICATION.md','index.html','sample.html','decision-evidence-sample.html']
  pull_request:
    paths: ['capturebrief_core/**','tests/**','fixtures/**','scripts/**','assets/**','netlify-build.sh','netlify.toml','.github/workflows/product-core.yml','PRODUCT-CORE.md','DECISION-EVIDENCE.md','RULE-SOURCES.md','RULE-SOURCE-CATALOG.json','SOURCE-POLICY.md','ARCHIVE-CATALOG.md','REFERENCE-REVIEW.md','OUTCOME-LEDGER.md','BUSINESS-MODEL-v7.md','CALIBRATION-PROTOCOL.md','OUTBOUND-COMMUNICATIONS.md','PUBLIC-RELEASE.md','RELEASE-CONSISTENCY.md','DELIVERY-VERIFICATION.md','index.html','sample.html','decision-evidence-sample.html']
permissions:
  contents: read
jobs:
  product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile product core
        run: python -m compileall -q capturebrief_core
      - name: Run regression corpus
        run: python -m unittest discover -s tests -v
      - name: Netlify public deployment boundary
        run: python -m unittest tests.test_netlify_public_boundary -v
      - name: Decision evidence contracts
        run: python -m unittest tests.test_decision_trace -v
      - name: Customer delivery bundle contracts
        run: python -m unittest tests.test_delivery_bundle -v
      - name: Delivery command and existing archive verification
        run: python -m unittest tests.test_delivery_command tests.test_delivery_verify -v
      - name: Shared release consistency integration contracts
        run: python -m unittest tests.test_release_consistency -v
      - name: Targeted watch baseline contracts
        run: python -m unittest tests.test_watch_baseline -v
      - name: Commercial outcome ledger contracts
        run: python -m unittest tests.test_outcomes -v
      - name: Internal calibration contracts
        run: python -m unittest tests.test_calibration -v
      - name: Exercise calibration CLI
        run: |
          python -m capturebrief_core.cli calibration-validate fixtures/calibration_review_example.json -o /tmp/calibration-valid.json
          python -m capturebrief_core.cli calibration-summary fixtures/calibration_review_example.json -o /tmp/calibration-summary.json
          grep -q '"calibration_state": "OPEN_CRITICAL_OR_MATERIAL"' /tmp/calibration-summary.json
          grep -q '"public_attribution_allowed": false' /tmp/calibration-summary.json
      - name: Exercise outcome ledger CLI
        run: |
          python -m capturebrief_core.cli outcome-validate fixtures/outcome_event_example.json -o /tmp/outcome-valid.json
          python -m capturebrief_core.cli outcome-append /tmp/capturebrief-outcomes.jsonl fixtures/outcome_event_example.json --recorded-at 2026-09-21T18:10:00Z -o /tmp/outcome-record.json
          python -m capturebrief_core.cli outcome-effort /tmp/capturebrief-outcomes.jsonl CB-EFFORT aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa ASSUMPTION_REVIEW 15 timer:CB-EFFORT:review --event-at 2026-09-21T18:20:00Z --recorded-at 2026-09-21T18:21:00Z -o /tmp/effort-record.json
          python -m capturebrief_core.cli outcome-summary /tmp/capturebrief-outcomes.jsonl -o /tmp/outcome-summary.json
      - name: Build and independently reopen the command-produced delivery
        run: |
          python -m capturebrief_core.trace_cli bundle fixtures/ready_trace_case.json -o /tmp/capturebrief-delivery.zip > /tmp/capturebrief-delivery-receipt.json
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          path = Path('/tmp/capturebrief-delivery.zip')
          receipt = json.loads(Path('/tmp/capturebrief-delivery-receipt.json').read_text())
          assert zipfile.is_zipfile(path), 'Command output is not a ZIP'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == receipt['bundle_sha256']
          assert path.stat().st_size == receipt['bundle_bytes']
          assert receipt['artifact_verification']['integrity_verified'] is True
          assert receipt['external_send_authorized'] is False
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) == 7
          print('Verified actual CLI ZIP, independent hashes, and separate receipt.')
          PY
          EXPECTED_SHA="$(python -c "import json; print(json.load(open('/tmp/capturebrief-delivery-receipt.json'))['bundle_sha256'])")"
          python -m capturebrief_core.trace_cli verify-bundle /tmp/capturebrief-delivery.zip --expected-sha256 "$EXPECTED_SHA" > /tmp/capturebrief-delivery-verification.json
          grep -q '"verification_state": "VERIFIED_INTEGRITY"' /tmp/capturebrief-delivery-verification.json
      - name: Build and compare targeted watch baseline
        run: |
          python -m capturebrief_core.trace_cli watch-baseline fixtures/ready_trace_case.json -o /tmp/watch-baseline.json --as-of 2026-09-21T17:30:00Z
          python -m capturebrief_core.trace_cli watch-check /tmp/watch-baseline.json fixtures/ready_trace_case.json -o /tmp/watch-check.json --as-of 2026-09-21T17:30:00Z
          grep -q '"watch_status": "NO_CHANGE_OBSERVED"' /tmp/watch-check.json
          grep -q '"fresh_observation_evidenced": true' /tmp/watch-check.json
      - name: FAR DFARS rule registry contracts
        run: python -m unittest tests.test_rule_registry -v
      - name: Pinned GSA rule source sync contracts
        run: python -m unittest tests.test_rule_sync -v
      - name: Missing rule auto-sync contracts
        run: python -m unittest tests.test_rule_auto_sync -v
      - name: Pinned class-deviation discovery and artifact contracts
        run: python -m unittest tests.test_deviation_sync -v
      - name: Structured deviation authority review contracts
        run: python -m unittest tests.test_deviation_review -v
      - name: Class-deviation applicability contracts
        run: python -m unittest tests.test_deviation_applicability -v
      - name: Class-deviation targeted watch contracts
        run: python -m unittest tests.test_deviation_watch -v
      - name: Exact rule evidence preparation contracts
        run: python -m unittest tests.test_rule_evidence -v
      - name: Human rule applicability contracts
        run: python -m unittest tests.test_rule_applicability -v
      - name: Rule citation and human review contracts
        run: python -m unittest tests.test_rule_candidates -v
      - name: Build case from website intake
        run: python -m capturebrief_core.cli case-from-intake fixtures/intake.json --submitted-at 2026-09-21T15:00:00+00:00 -o /tmp/intake-case.json
      - name: Build operator work queue
        run: python -m capturebrief_core.cli work-queue /tmp/intake-case.json -o /tmp/work-queue.json
      - name: Verify fulfillment and bundle readiness agree
        run: |
          python -m capturebrief_core.cli fulfillment-plan /tmp/intake-case.json -o /tmp/intake-plan.json
          grep -q '"release_state": "FAIL_CLOSED"' /tmp/intake-plan.json
          grep -q '"automatic_evidence_or_bid_decision": false' /tmp/intake-plan.json
          grep -q '"external_send_authorized": false' /tmp/intake-plan.json
          python -m capturebrief_core.cli fulfillment-plan fixtures/ready_case.json -o /tmp/legacy-plan.json
          grep -q '"fulfillment_state": "TRACE_UPGRADE_REQUIRED"' /tmp/legacy-plan.json
          grep -q '"delivery_bundle_eligible": false' /tmp/legacy-plan.json
          python -m capturebrief_core.cli fulfillment-plan fixtures/ready_trace_case.json -o /tmp/traced-plan.json
          grep -q '"delivery_bundle_eligible": true' /tmp/traced-plan.json
      - name: Validate releasable fixture
        run: python -m capturebrief_core.cli validate fixtures/ready_case.json
      - name: Render releasable fixture
        run: python -m capturebrief_core.cli render fixtures/ready_case.json -o /tmp/capturebrief.md
      - name: Exercise targeted change watch
        run: python -m capturebrief_core.cli diff fixtures/ready_case.json fixtures/changed_case.json > /tmp/change.json

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile product core
        run: python -m compileall -q capturebrief_core
      - name: Verify Windows file and SQLite lifecycle contracts
        run: >-
          python -m unittest
          tests.test_delivery_command
          tests.test_rule_registry
          tests.test_rule_evidence
          tests.test_rule_sync
          tests.test_history_index
          tests.test_resolution_sync
          -v
