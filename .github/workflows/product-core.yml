name: Product Core
on:
  push:
    paths: ['capturebrief_core/**','tests/**','fixtures/**','.github/workflows/product-core.yml','PRODUCT-CORE.md','DECISION-EVIDENCE.md','RULE-SOURCES.md','RULE-SOURCE-CATALOG.json','SOURCE-POLICY.md','ARCHIVE-CATALOG.md','REFERENCE-REVIEW.md']
  pull_request:
    paths: ['capturebrief_core/**','tests/**','fixtures/**','.github/workflows/product-core.yml','PRODUCT-CORE.md','SOURCE-POLICY.md','REFERENCE-REVIEW.md']
permissions:
  contents: read
jobs:
  product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile product core
        run: python -m py_compile capturebrief_core/*.py
      - name: Run regression corpus
        run: python -m unittest discover -s tests -v
      - name: Decision evidence contracts
        run: python -m unittest tests.test_decision_trace -v
      - name: Customer delivery bundle contracts
        run: python -m unittest tests.test_delivery_bundle -v
      - name: Build release-gated customer bundle
        run: python -m capturebrief_core.trace_cli bundle fixtures/ready_trace_case.json -o /tmp/capturebrief-delivery.zip
      - name: FAR DFARS rule registry contracts
        run: python -m unittest tests.test_rule_registry -v
      - name: Pinned GSA rule source sync contracts
        run: python -m unittest tests.test_rule_sync -v
      - name: Missing rule auto-sync contracts
        run: python -m unittest tests.test_rule_auto_sync -v
      - name: Exact rule evidence preparation contracts
        run: python -m unittest tests.test_rule_evidence -v
      - name: Human rule applicability contracts
        run: python -m unittest tests.test_rule_applicability -v
      - name: Rule citation and human review contracts
        run: python -m unittest tests.test_rule_candidates -v
      - name: Build case from website intake
        run: python -m capturebrief_core.cli case-from-intake fixtures/intake.json --submitted-at 2026-09-21T15:00:00+00:00 -o /tmp/intake-case.json
      - name: Build operator work queue
        run: python -m capturebrief_core.cli work-queue /tmp/intake-case.json -o /tmp/work-queue.json
      - name: Validate releasable fixture
        run: python -m capturebrief_core.cli validate fixtures/ready_case.json
      - name: Render releasable fixture
        run: python -m capturebrief_core.cli render fixtures/ready_case.json -o /tmp/capturebrief.md
      - name: Exercise targeted change watch
        run: python -m capturebrief_core.cli diff fixtures/ready_case.json fixtures/changed_case.json > /tmp/change.json
