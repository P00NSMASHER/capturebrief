name: CaptureBrief backend snapshot verification

on:
  push:
    branches:
      - portfolio/2026-09-18-program
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/capturebrief-backend-snapshot.yml"
      - "OPEN_SOURCE_PROVENANCE.md"
      - "OPPORTUNITY_RECORD_CONTRACT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-backend-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable release and run original tests
        run: python backend/verify_release_snapshot.py

      - name: Run normalized portfolio backend tests
        run: python -m unittest discover -s backend/tests -v
