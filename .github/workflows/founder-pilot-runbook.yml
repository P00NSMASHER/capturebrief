name: Founder-curated first-pilot runbook contract
on:
  pull_request:
    paths:
      - 'FIRST-PILOT-OPERATOR-RUNBOOK.md'
      - 'scripts/audit_founder_pilot_runbook.py'
      - 'tests/test_founder_pilot_runbook.py'
      - '.github/workflows/founder-pilot-runbook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-runbook-contract:
    name: No-card operator policy and preflight / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Check out exact proposed revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out commit on both runners
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import os, subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert actual==os.environ['EXPECTED_HEAD'], 'not the proposed exact head'"
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check static operator policy without customer/network activity
        run: python scripts/audit_founder_pilot_runbook.py
      - name: Run adversarial operator-contract regression
        run: python -m unittest tests.test_founder_pilot_runbook -v
