name: CaptureBrief scoped on-demand and encrypted-backup acceptance

on:
  pull_request:
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'tests/test_scoped_source.py'
      - 'tests/test_scoped_private_backup.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'
  push:
    branches: [main]
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'tests/test_scoped_source.py'
      - 'tests/test_scoped_private_backup.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'

permissions:
  contents: read

concurrency:
  group: scoped-evidence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  encrypted-backup-evidence:
    name: Offline scoped-source and AES-GCM replay / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact proposed code without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned release-tested cryptography dependency
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4'
      - name: Compile only scoped source and secure backup
        run: python -m compileall -q capturebrief_core/scoped_source.py scripts/prepare_scoped_sam.py scripts/scoped_private_backup.py
      - name: Run real code against deliberately synthetic offline tests
        run: python -m unittest tests.test_scoped_source tests.test_scoped_private_backup tests.test_founder_curated_admission -v
