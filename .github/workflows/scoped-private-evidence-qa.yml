name: CaptureBrief scoped on-demand and encrypted-backup acceptance

on:
  pull_request:
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_live_capturebrief_state_secret.py'
      - 'tests/test_qa_live_capturebrief_state_secret.py'
      - 'scripts/snapshot_authorization_ledger.py'
      - 'tests/test_full_case_backup.py'
      - 'tests/test_authorization_ledger_snapshot.py'
      - 'COMPLETE-CASE-RECOVERY.md'
      - 'scripts/free_check_registry_backup.py'
      - 'tests/test_scoped_source.py'
      - 'capturebrief_core/accepted_case_release.py'
      - 'capturebrief_core/authorization_ledger.py'
      - 'scripts/check_accepted_case_release.py'
      - 'tests/test_accepted_case_release.py'
      - 'tests/test_authorization_ledger_preprovision.py'
      - 'ACCEPTED-CASE-RELEASE-GATES.md'
      - 'tests/test_scoped_private_backup.py'
      - 'tests/test_free_check_registry_backup.py'
      - 'scripts/qa_full_case_cross_runner.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'
  push:
    branches: [main]
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_live_capturebrief_state_secret.py'
      - 'tests/test_qa_live_capturebrief_state_secret.py'
      - 'scripts/snapshot_authorization_ledger.py'
      - 'tests/test_full_case_backup.py'
      - 'tests/test_authorization_ledger_snapshot.py'
      - 'COMPLETE-CASE-RECOVERY.md'
      - 'scripts/free_check_registry_backup.py'
      - 'tests/test_scoped_source.py'
      - 'capturebrief_core/accepted_case_release.py'
      - 'capturebrief_core/authorization_ledger.py'
      - 'scripts/check_accepted_case_release.py'
      - 'tests/test_accepted_case_release.py'
      - 'tests/test_authorization_ledger_preprovision.py'
      - 'ACCEPTED-CASE-RELEASE-GATES.md'
      - 'tests/test_scoped_private_backup.py'
      - 'tests/test_free_check_registry_backup.py'
      - 'scripts/qa_full_case_cross_runner.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'

permissions:
  contents: read

concurrency:
  group: scoped-evidence-strict-history-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  encrypted-backup-evidence:
    name: Offline scoped-source, registry and AES-GCM replay / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact proposed code without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned release-tested cryptography dependency
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4'
      - name: Compile only scoped source and secure backup
        run: python -m compileall -q capturebrief_core/scoped_source.py capturebrief_core/accepted_case_release.py capturebrief_core/authorization_ledger.py scripts/prepare_scoped_sam.py scripts/scoped_private_backup.py scripts/full_case_backup.py scripts/qa_live_capturebrief_state_secret.py scripts/snapshot_authorization_ledger.py scripts/free_check_registry_backup.py scripts/check_accepted_case_release.py
      - name: Run real code against deliberately synthetic offline tests
        run: python -m unittest tests.test_scoped_source tests.test_scoped_private_backup tests.test_full_case_backup tests.test_qa_live_capturebrief_state_secret tests.test_authorization_ledger_snapshot tests.test_founder_curated_admission tests.test_free_check_registry_backup tests.test_accepted_case_release tests.test_authorization_ledger_preprovision -v

  fictional-crossrunner-producer:
    name: Produce fictional encrypted original / Linux
    needs: encrypted-backup-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact proposed head without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned release-tested cryptography dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Produce bounded fictional AES-GCM original
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa_full_case_cross_runner.py produce --artifact-dir "$RUNNER_TEMP/capturebrief-crossrunner-fictional"
      - name: Transfer ciphertext and content-digest manifest only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capturebrief-fictional-crossrunner
          path: ${{ runner.temp }}/capturebrief-crossrunner-fictional/
          if-no-files-found: error
          retention-days: 1

  fictional-crossrunner-consumer:
    name: Restore exact original bytes / independent Windows runner
    needs: fictional-crossrunner-producer
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact proposed head without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact event head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) {
            throw "Checked-out source is not the exact event head"
          }
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned release-tested cryptography dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Retrieve exact prior-runner ciphertext
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: capturebrief-fictional-crossrunner
          path: ${{ runner.temp }}/capturebrief-crossrunner-fictional/
      - name: Authenticate and reconcile all 13 fictional originals
        shell: pwsh
        run: |
          python scripts/qa_full_case_cross_runner.py consume --artifact-dir "$env:RUNNER_TEMP/capturebrief-crossrunner-fictional" --restore-dir "$env:RUNNER_TEMP/capturebrief-crossrunner-restore"
