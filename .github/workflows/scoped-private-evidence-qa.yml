name: CaptureBrief scoped on-demand and encrypted-backup acceptance

on:
  pull_request:
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_live_capturebrief_state_secret.py'
      - 'tests/test_qa_live_capturebrief_state_secret.py'
      - 'scripts/snapshot_authorization_ledger.py'
      - 'tests/test_full_case_backup.py'
      - 'tests/test_authorization_ledger_snapshot.py'
      - 'COMPLETE-CASE-RECOVERY.md'
      - 'scripts/free_check_registry_backup.py'
      - 'tests/test_scoped_source.py'
      - 'capturebrief_core/accepted_case_release.py'
      - 'capturebrief_core/authorization_ledger.py'
      - 'scripts/check_accepted_case_release.py'
      - 'tests/test_accepted_case_release.py'
      - 'ACCEPTED-CASE-RELEASE-GATES.md'
      - 'tests/test_scoped_private_backup.py'
      - 'tests/test_free_check_registry_backup.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'
  push:
    branches: [main]
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_live_capturebrief_state_secret.py'
      - 'tests/test_qa_live_capturebrief_state_secret.py'
      - 'scripts/snapshot_authorization_ledger.py'
      - 'tests/test_full_case_backup.py'
      - 'tests/test_authorization_ledger_snapshot.py'
      - 'COMPLETE-CASE-RECOVERY.md'
      - 'scripts/free_check_registry_backup.py'
      - 'tests/test_scoped_source.py'
      - 'capturebrief_core/accepted_case_release.py'
      - 'capturebrief_core/authorization_ledger.py'
      - 'scripts/check_accepted_case_release.py'
      - 'tests/test_accepted_case_release.py'
      - 'ACCEPTED-CASE-RELEASE-GATES.md'
      - 'tests/test_scoped_private_backup.py'
      - 'tests/test_free_check_registry_backup.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'

permissions:
  contents: read

concurrency:
  group: scoped-evidence-strict-history-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  encrypted-backup-evidence:
    name: Offline scoped-source, registry and AES-GCM replay / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact proposed code without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned release-tested cryptography dependency
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4'
      - name: Compile only scoped source and secure backup
        run: python -m compileall -q capturebrief_core/scoped_source.py capturebrief_core/accepted_case_release.py capturebrief_core/authorization_ledger.py scripts/prepare_scoped_sam.py scripts/scoped_private_backup.py scripts/full_case_backup.py scripts/qa_live_capturebrief_state_secret.py scripts/snapshot_authorization_ledger.py scripts/free_check_registry_backup.py scripts/check_accepted_case_release.py
      - name: Run real code against deliberately synthetic offline tests
        run: python -m unittest tests.test_scoped_source tests.test_scoped_private_backup tests.test_full_case_backup tests.test_qa_live_capturebrief_state_secret tests.test_authorization_ledger_snapshot tests.test_founder_curated_admission tests.test_free_check_registry_backup tests.test_accepted_case_release -v


  encrypted_fictional_cloud_upload:
    name: Private GitHub secret and fictional ciphertext readback (trusted main only)
    if: github.repository == 'P00NSMASHER/capturebrief' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: encrypted-backup-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      ciphertext_sha256: ${{ steps.encrypted.outputs.ciphertext_sha256 }}
    steps:
      - name: Read exact merged source without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned AES-GCM cryptography
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Independently verify exact main revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$GITHUB_REPOSITORY" = "P00NSMASHER/capturebrief"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push"
      - name: Check secret can read isolated private repository, no changes
        env:
          CAPTUREBRIEF_STATE_TOKEN: ${{ secrets.CAPTUREBRIEF_STATE_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/qa_live_capturebrief_state_secret.py preflight
      - name: Upload one authenticated encrypted 13-original FICTIONAL test archive only
        id: encrypted
        env:
          CAPTUREBRIEF_STATE_TOKEN: ${{ secrets.CAPTUREBRIEF_STATE_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/qa_live_capturebrief_state_secret.py upload

  encrypted_fictional_cloud_windows_restore:
    name: Separate Windows runner downloads and restores private GitHub ciphertext
    if: github.repository == 'P00NSMASHER/capturebrief' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: encrypted_fictional_cloud_upload
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Checkout exact merged recovery code without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned AES-GCM cryptography
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Retrieve encrypted fake case and rehash thirteen restored originals
        shell: pwsh
        env:
          CAPTUREBRIEF_STATE_TOKEN: ${{ secrets.CAPTUREBRIEF_STATE_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/qa_live_capturebrief_state_secret.py restore --sha256 "${{ needs.encrypted_fictional_cloud_upload.outputs.ciphertext_sha256 }}"
