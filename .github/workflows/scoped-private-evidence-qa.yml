name: CaptureBrief scoped on-demand and encrypted-backup acceptance

on:
  pull_request:
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_full_case_cross_runner.py'
      - 'tests/test_full_case_backup.py'
      - 'COMPLETE-CASE-RECOVERY.md'
      - 'scripts/free_check_registry_backup.py'
      - 'tests/test_scoped_source.py'
      - 'capturebrief_core/accepted_case_release.py'
      - 'capturebrief_core/authorization_ledger.py'
      - 'scripts/check_accepted_case_release.py'
      - 'tests/test_accepted_case_release.py'
      - 'ACCEPTED-CASE-RELEASE-GATES.md'
      - 'tests/test_scoped_private_backup.py'
      - 'tests/test_free_check_registry_backup.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'
  push:
    branches: [main]
    paths:
      - 'capturebrief_core/scoped_source.py'
      - 'scripts/prepare_scoped_sam.py'
      - 'scripts/scoped_private_backup.py'
      - 'scripts/full_case_backup.py'
      - 'scripts/qa_full_case_cross_runner.py'
      - 'tests/test_full_case_backup.py'
      - 'COMPLETE-CASE-RECOVERY.md'
      - 'scripts/free_check_registry_backup.py'
      - 'tests/test_scoped_source.py'
      - 'capturebrief_core/accepted_case_release.py'
      - 'capturebrief_core/authorization_ledger.py'
      - 'scripts/check_accepted_case_release.py'
      - 'tests/test_accepted_case_release.py'
      - 'ACCEPTED-CASE-RELEASE-GATES.md'
      - 'tests/test_scoped_private_backup.py'
      - 'tests/test_free_check_registry_backup.py'
      - '.github/workflows/scoped-private-evidence-qa.yml'

permissions:
  contents: read

concurrency:
  group: scoped-evidence-strict-history-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  encrypted-backup-evidence:
    name: Offline scoped-source, registry and AES-GCM replay / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact proposed code without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned release-tested cryptography dependency
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4'
      - name: Compile only scoped source and secure backup
        run: python -m compileall -q capturebrief_core/scoped_source.py capturebrief_core/accepted_case_release.py capturebrief_core/authorization_ledger.py scripts/prepare_scoped_sam.py scripts/scoped_private_backup.py scripts/full_case_backup.py scripts/free_check_registry_backup.py scripts/check_accepted_case_release.py
      - name: Run real code against deliberately synthetic offline tests
        run: python -m unittest tests.test_scoped_source tests.test_scoped_private_backup tests.test_full_case_backup tests.test_founder_curated_admission tests.test_free_check_registry_backup tests.test_accepted_case_release -v


  fictional-full-case-producer:
    name: Produce public-key fictional encrypted full case (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned cryptography
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Create encrypted fictional case with real production backup code
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/capturebrief-fake-only"
          python scripts/qa_full_case_cross_runner.py produce --artifact-dir "$RUNNER_TEMP/capturebrief-fake-only"
      - name: Upload only encrypted fictional archive and prior-run SHA receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capturebrief-fictional-encrypted
          path: |
            ${{ runner.temp }}/capturebrief-fake-only/fictional-complete-case.cbak
            ${{ runner.temp }}/capturebrief-fake-only/fictional-ciphertext-sha256.json
          retention-days: 2
          if-no-files-found: error

  independent-full-case-consumer:
    name: Restore and rehash all fictional originals on separate Windows runner
    needs: fictional-full-case-producer
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned cryptography
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.4
      - name: Download only encrypted fictional evidence and SHA receipt
        uses: actions/download-artifact@v4
        with:
          name: capturebrief-fictional-encrypted
          path: ${{ runner.temp }}/cb-fictional-ciphertext
      - name: Independently verify and restore all original bytes on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/qa_full_case_cross_runner.py consume --artifact-dir "${{ runner.temp }}/cb-fictional-ciphertext" --restore-dir "${{ runner.temp }}/cb-independent-restore"
