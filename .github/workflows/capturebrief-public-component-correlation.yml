name: CaptureBrief SAM Original-Row Correlation
on:
  pull_request:
    paths:
      - 'scripts/validate_live_public_sources.py'
      - 'tests/test_public_component_source_correlation.py'
      - '.github/workflows/capturebrief-public-component-correlation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-component-correlation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile public-source original-byte component
        run: python -m compileall -q scripts/validate_live_public_sources.py
      - name: Adversarial source-correlation and source-slot test
        run: python -m unittest tests.test_public_component_source_correlation -v
