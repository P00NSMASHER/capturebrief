name: Refresh ABVM school pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/abvm-school-pack.yml'
      - 'scripts/validate_abvm_school_pack.py'
      - 'tests/test_abvm_school_pack_workflow.py'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abvm-school-pack-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact current main before write
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$GITHUB_SHA"

      - name: Check out published Pages branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages
          path: .published
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch candidate ABVM source pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            -H 'accept: application/json' \
            -H 'cache-control: no-cache' \
            'https://api-v2.appdeploy.ai/app/abvm-source-bridge-gkj08k/api/study-pack' \
            -o "$RUNNER_TEMP/abvm-study-pack.json"

      - name: Validate freshness and source-bound content
        shell: bash
        run: |
          set -euo pipefail
          python .trusted/scripts/validate_abvm_school_pack.py \
            --input "$RUNNER_TEMP/abvm-study-pack.json" \
            --existing .published/abvm/data/study-pack.json \
            --output .published/abvm/data/study-pack.json

      - name: Publish only when verified school content changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git -C .published diff --quiet -- abvm/data/study-pack.json; then
            echo "No authoritative ABVM school-pack change."
            exit 0
          fi
          git -C .published config user.name "github-actions[bot]"
          git -C .published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .published add abvm/data/study-pack.json
          git -C .published commit -m "Refresh verified ABVM school pack"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C .published \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push origin HEAD:gh-pages

      # Preserve the current post-publication CaptureBrief Cloudflare
      # verification after updating gh-pages; do not drop this release gate.
      - name: Prepare pinned tools for CaptureBrief production verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Verify exact CaptureBrief Cloudflare release after ABVM refresh
        working-directory: .published
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node build-standalone-site.test.js
          python -m py_compile .github/cloudflare_light_smoke.py
          PYTHONPATH=.github python -m unittest test_cloudflare_edge_integrity -v
          node build-standalone-site.js
          python .github/cloudflare_light_smoke.py
