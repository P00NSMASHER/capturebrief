name: Refresh ABVM school pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/abvm-school-pack.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abvm-school-pack-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out published Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Fetch and validate current ABVM source pack
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --fail --silent --show-error --location             --retry 3 --retry-delay 5             -H 'accept: application/json'             -H 'cache-control: no-cache'             'https://api-v2.appdeploy.ai/app/abvm-source-bridge-gkj08k/api/study-pack'             -o "$tmp"
          python - "$tmp" <<'PY'
          import json
          import pathlib
          import sys

          src = pathlib.Path(sys.argv[1])
          data = json.loads(src.read_text())
          pack = data.get("pack") or {}

          if pack.get("sourceSufficient") is not True:
              raise SystemExit("Refusing incomplete ABVM school pack")

          questions = pack.get("questions")
          if not isinstance(questions, list) or not any(
              isinstance(q, dict) and q.get("prompt") and q.get("answer")
              for q in questions
          ):
              raise SystemExit("Refusing ABVM pack without usable practice questions")

          target = pathlib.Path("abvm/data/study-pack.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Publish only when verified school data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- abvm/data/study-pack.json; then
            echo "No ABVM school-pack changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abvm/data/study-pack.json
          git commit -m "Refresh verified ABVM school pack"
          git push origin HEAD:gh-pages
