name: Website quality
on:
  push:
    branches: [gh-pages, site-clarity-20260921, 'pages-buyer-evidence-*']
    paths: ['**/*.html', 'index.html', 'decision-evidence.html', 'examples/**', 'permitplate/**', 'freightrecovery/**', 'assets/**', '.github/site_qa.py', '.github/brand_qa.py', '.github/buyer_journey_qa.py', '.github/clipboard_qa.py', '.github/clipboard_unit.cjs', '.github/request_draft_unit.cjs', '.github/cloudflare_company_live_qa.py', '.github/cloudflare_edge_integrity.py', '.github/test_cloudflare_edge_integrity.py', '.github/cloudflare_byte_diagnostic.py', 'build-standalone-site.js', 'build-standalone-site.test.js', '.github/v3_question_desk_unit.cjs', '.github/v4_preflight_unit.cjs', '.github/workflows/site-quality.yml']
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capturebrief-production-acceptance:
    name: CaptureBrief production exact bytes and no-send / ${{ matrix.browser }}
    if: github.repository == 'P00NSMASHER/capturebrief' && (github.ref == 'refs/heads/gh-pages' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the exact standalone release builder and edge-byte guard
        run: |
          node build-standalone-site.test.js
          PYTHONPATH=.github python -m unittest test_cloudflare_edge_integrity -v
          node build-standalone-site.js
      - name: Use bounded official Ubuntu mirrors
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/apt/apt-mirrors.txt')
          if p.is_file():
              s=p.read_text().replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu')
              s=s.replace('https://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu')
              p.write_text(s)
          Path('/etc/apt/apt.conf.d/99capturebrief-production-qa').write_text(
              'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n')
          PY
      - name: Install pinned standalone browser only
        timeout-minutes: 10
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify Cloudflare production revision, static bytes, privacy boundary and fictional no-send copy
        env:
          PR_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          QA_BROWSER: ${{ matrix.browser }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_COMMIT"
            export GITHUB_SHA="$PR_BASE_COMMIT"
          else
            test "$GITHUB_REF" = "refs/heads/gh-pages"
          fi
          python .github/cloudflare_company_live_qa.py

  publication-source-scope:
    name: Source-only Pages path selection / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Adversarial generated-dist and sibling-source scope regressions
        run: python -m unittest discover -s .github -p 'test_capturebrief_publication_paths.py' -v
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public branding on every hosted page
        run: python .github/brand_qa.py
        env:
          QA_OUTPUT: qa-output/brand
      - name: Verify standalone company security and checkout boundary
        run: node build-standalone-site.test.js
      - name: Compile production smoke acceptance before publication
        run: python -m py_compile .github/cloudflare_company_live_qa.py
      - name: Reject generated Cloudflare dist as a legacy GitHub Pages source
        run: python -m unittest discover -s .github -p 'test_capturebrief_publication_paths.py' -v
      - name: Compare public Cloudflare response bytes with generated release (diagnostic only)
        if: matrix.browser == 'chromium'
        run: |
          node build-standalone-site.js
          python .github/cloudflare_byte_diagnostic.py
      - name: Reject unsigned Cloudflare response alterations in standalone tests
        run: PYTHONPATH=.github python -m unittest test_cloudflare_edge_integrity -v
      - name: Use bounded official Ubuntu package downloads
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          if mirrors.is_file():
              original = mirrors.read_text()
              updated = original.replace('http://azure.archive.ubuntu.com/ubuntu',
                                          'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('https://azure.archive.ubuntu.com/ubuntu',
                                        'https://archive.ubuntu.com/ubuntu')
              mirrors.write_text(updated)
          # Keep package signature verification and the full browser dependencies.
          Path('/etc/apt/apt.conf.d/99capturebrief-browser-downloads').write_text(
              'Acquire::Retries "2";\n'
              'Acquire::http::Timeout "30";\n'
              'Acquire::https::Timeout "30";\n')
          PY
      - name: Install pinned browser test tools
        timeout-minutes: 10
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Render and test the committed websites
        run: python .github/site_qa.py
        env:
          SITE_ROOT: .
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/build
      - name: Test evidence disclosures and the buyer request path in Chromium
        if: matrix.browser == 'chromium'
        run: python .github/buyer_journey_qa.py
        env:
          SITE_ROOT: .
          QA_OUTPUT: qa-output/buyer-build
      - name: Test clipboard fallback without touching the system clipboard
        run: node .github/clipboard_unit.cjs
      - name: Verify free and paid request contracts without sending
        run: node .github/request_draft_unit.cjs
      - name: Verify CaptureBrief 3.0 decision desk without sending
        run: node .github/v3_question_desk_unit.cjs
      - name: Verify CaptureBrief 4.0 evidence preflight without sending
        run: node .github/v4_preflight_unit.cjs
      - name: Verify clipboard failure recovery in the built website
        run: python .github/clipboard_qa.py
        env:
          SITE_ROOT: .
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/clipboard-build
      - name: Wait for GitHub Pages to publish this exact release
        if: github.ref == 'refs/heads/gh-pages'
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path
          base = 'https://p00nsmasher.github.io/capturebrief/'
          paths = ['index.html','permitplate/index.html','assets/clarity.css','decision-evidence.html','assets/evidence.css','assets/enterprise.css','assets/enterprise.js','assets/capturebrief.css','assets/capturebrief.js','assets/v3-intake.css','assets/v3-intake.js','assets/v4-preflight.css','assets/v4-preflight.js','assets/og-capturebrief.png','assets/visuals/hero-council.webp','assets/visuals/evidence-layers.webp','assets/visuals/reviewer-desk.webp','assets/visuals/change-watch.webp','assets/visuals/architecture-grid.webp','assets/visuals/capturebrief-social.jpg','assets/fonts/newsreader-latin-wght-normal.woff2','assets/fonts/newsreader-latin-wght-italic.woff2','assets/fonts/familjen-grotesk-latin-wght-normal.woff2','assets/fonts/azeret-mono-latin-wght-normal.woff2','favicon.svg','examples/manifest.json']
          paths += [x['path'] for x in json.loads(Path('examples/manifest.json').read_text())['files']]
          import sys
          sys.path.insert(0, str(Path('.github').resolve()))
          from capturebrief_publication_paths import discover_source_html
          paths += discover_source_html(Path('.'), already_expected=paths)
          expected = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          observed = {}
          retired_status = None
          for attempt in range(12):
              observed = {}
              for path in paths:
                  try:
                      with urllib.request.urlopen(base + path + '?quality=' + os.environ['GITHUB_SHA'], timeout=20) as response:
                          observed[path] = hashlib.sha256(response.read()).hexdigest()
                  except Exception:
                      observed[path] = None
                  if observed[path] != expected[path]:
                      break
              try:
                  with urllib.request.urlopen(base + 'freightrecovery/?quality=' + os.environ['GITHUB_SHA'], timeout=20) as response:
                      retired_status = response.status
              except urllib.error.HTTPError as error:
                  retired_status = error.code
              except Exception:
                  retired_status = None
              if observed == expected and retired_status == 404:
                  break
              time.sleep(15)
          passed = observed == expected and retired_status == 404
          report = {'commit': os.environ['GITHUB_SHA'], 'base_url': base, 'expected': expected, 'observed': observed, 'retired_freight_status': retired_status, 'passed': passed}
          out = Path('qa-output'); out.mkdir(exist_ok=True)
          (out/'published-bytes.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          if not report['passed']:
              raise SystemExit('Published bytes do not yet match; live verification is not complete.')
          PY
      - name: Verify the public deployment
        if: github.ref == 'refs/heads/gh-pages'
        run: python .github/site_qa.py
        env:
          QA_BASE_URL: https://p00nsmasher.github.io/capturebrief/
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/live
      - name: Verify the live evidence example and buyer path in Chromium
        if: github.ref == 'refs/heads/gh-pages' && matrix.browser == 'chromium'
        run: python .github/buyer_journey_qa.py
        env:
          QA_BASE_URL: https://p00nsmasher.github.io/capturebrief/
          QA_OUTPUT: qa-output/buyer-live
      - name: Verify clipboard failure recovery on the published site
        if: github.ref == 'refs/heads/gh-pages'
        run: python .github/clipboard_qa.py
        env:
          QA_BASE_URL: https://p00nsmasher.github.io/capturebrief/
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/clipboard-live
      - name: Verify exact Cloudflare production release and fictional no-send inquiry
        if: github.ref == 'refs/heads/gh-pages'
        run: |
          node build-standalone-site.js
          python .github/cloudflare_company_live_qa.py
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - name: Preserve reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-quality-${{ matrix.browser }}-${{ github.sha }}
          path: qa-output/
          retention-days: 7
          if-no-files-found: error
