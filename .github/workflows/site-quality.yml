name: Website quality
on:
  push:
    branches: [gh-pages, site-clarity-20260921, 'pages-buyer-evidence-*']
    paths: ['**/*.html', 'index.html', 'decision-evidence.html', 'examples/**', 'permitplate/**', 'freightrecovery/**', 'assets/**', '.github/site_qa.py', '.github/brand_qa.py', '.github/buyer_journey_qa.py', '.github/workflows/site-quality.yml']
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public branding on every hosted page
        run: python .github/brand_qa.py
        env:
          QA_OUTPUT: qa-output/brand
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Render and test the committed websites
        run: python .github/site_qa.py
        env:
          SITE_ROOT: .
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/build
      - name: Test evidence disclosures and the buyer request path in Chromium
        if: matrix.browser == 'chromium'
        run: python .github/buyer_journey_qa.py
        env:
          SITE_ROOT: .
          QA_OUTPUT: qa-output/buyer-build
      - name: Wait for GitHub Pages to publish this exact release
        if: github.ref == 'refs/heads/gh-pages'
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base = 'https://p00nsmasher.github.io/capturebrief/'
          paths = ['index.html','permitplate/index.html','freightrecovery/index.html','assets/clarity.css','decision-evidence.html','assets/evidence.css','assets/enterprise.css','assets/enterprise.js','assets/capturebrief.css','assets/capturebrief.js','assets/og-capturebrief.png','assets/visuals/hero-council.webp','assets/visuals/evidence-layers.webp','assets/visuals/reviewer-desk.webp','assets/visuals/change-watch.webp','assets/visuals/architecture-grid.webp','assets/visuals/capturebrief-social.jpg','assets/fonts/newsreader-latin-wght-normal.woff2','assets/fonts/newsreader-latin-wght-italic.woff2','assets/fonts/familjen-grotesk-latin-wght-normal.woff2','assets/fonts/azeret-mono-latin-wght-normal.woff2','favicon.svg','examples/manifest.json']
          paths += [x['path'] for x in json.loads(Path('examples/manifest.json').read_text())['files']]
          paths += [p.as_posix() for p in Path('.').rglob('*.html') if not p.as_posix().startswith(('.github/', 'qa-output/', '.git/')) and p.as_posix() not in paths]
          expected = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          observed = {}
          for attempt in range(12):
              observed = {}
              for path in paths:
                  try:
                      with urllib.request.urlopen(base + path + '?quality=' + os.environ['GITHUB_SHA'], timeout=20) as response:
                          observed[path] = hashlib.sha256(response.read()).hexdigest()
                  except Exception:
                      observed[path] = None
                  if observed[path] != expected[path]:
                      break
              if observed == expected:
                  break
              time.sleep(15)
          report = {'commit': os.environ['GITHUB_SHA'], 'base_url': base, 'expected': expected, 'observed': observed, 'passed': observed == expected}
          out = Path('qa-output'); out.mkdir(exist_ok=True)
          (out/'published-bytes.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          if not report['passed']:
              raise SystemExit('Published bytes do not yet match; live verification is not complete.')
          PY
      - name: Verify the public deployment
        if: github.ref == 'refs/heads/gh-pages'
        run: python .github/site_qa.py
        env:
          QA_BASE_URL: https://p00nsmasher.github.io/capturebrief/
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/live
      - name: Verify the live evidence example and buyer path in Chromium
        if: github.ref == 'refs/heads/gh-pages' && matrix.browser == 'chromium'
        run: python .github/buyer_journey_qa.py
        env:
          QA_BASE_URL: https://p00nsmasher.github.io/capturebrief/
          QA_OUTPUT: qa-output/buyer-live
      - name: Preserve reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-quality-${{ matrix.browser }}-${{ github.sha }}
          path: qa-output/
          retention-days: 7
          if-no-files-found: error
