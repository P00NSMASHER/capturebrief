name: Website quality
on:
  push:
    branches: [gh-pages, site-clarity-20260921]
    paths: ['index.html', 'permitplate/**', 'freightrecovery/**', 'assets/**', '.github/site_qa.py', '.github/workflows/site-quality.yml']
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Render and test the committed websites
        run: python .github/site_qa.py
        env:
          SITE_ROOT: .
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/build
      - name: Wait for GitHub Pages to publish this exact release
        if: github.ref == 'refs/heads/gh-pages'
        run: |
          python - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          base = 'https://p00nsmasher.github.io/capturebrief/'
          paths = ['index.html', 'permitplate/index.html', 'freightrecovery/index.html', 'assets/clarity.css']
          for attempt in range(10):
              ready = []
              for path in paths:
                  try:
                      with urllib.request.urlopen(base + path + '?quality=' + os.environ['GITHUB_SHA'], timeout=20) as response:
                          ready.append(response.read() == Path(path).read_bytes())
                  except Exception:
                      ready.append(False)
              if all(ready):
                  print('All three pages and the clarity stylesheet match the committed bytes.')
                  break
              time.sleep(15)
          else:
              raise SystemExit('Published bytes do not yet match; live verification is not complete.')
          PY
      - name: Verify the public deployment
        if: github.ref == 'refs/heads/gh-pages'
        run: python .github/site_qa.py
        env:
          QA_BASE_URL: https://p00nsmasher.github.io/capturebrief/
          QA_BROWSER: ${{ matrix.browser }}
          QA_OUTPUT: qa-output/live
      - name: Preserve reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-quality-${{ matrix.browser }}-${{ github.sha }}
          path: qa-output/
          retention-days: 7
          if-no-files-found: error
