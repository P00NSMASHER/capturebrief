name: CaptureBrief FY2027 bounded gzip sampling (NO RETENTION)

on:
  push:
    branches:
      - research/fy2027-compression-sampling-20261019
    paths:
      - '.github/workflows/capturebrief-fy2027-compression-sample.yml'
      - 'scripts/fy2027_archive_compression_probe.py'
      - 'tests/test_fy2027_archive_compression_probe.py'
  pull_request:
    paths:
      - '.github/workflows/capturebrief-fy2027-compression-sample.yml'
      - 'scripts/fy2027_archive_compression_probe.py'
      - 'tests/test_fy2027_archive_compression_probe.py'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bounded original-only range probe
        run: python -m compileall -q scripts/fy2027_archive_compression_probe.py
      - name: Exercise synthetic bounded-range and no-release negative controls
        run: python -m unittest tests.test_fy2027_archive_compression_probe -v

  public-sampling:
    needs: offline
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: early-history
            years: '1969,1970,1980,1981,1998,1999,2000,2001,2002'
          - group: fy2003-2011
            years: '2003,2004,2005,2006,2007,2008,2009,2010,2011'
          - group: fy2012-2020
            years: '2012,2013,2014,2015,2016,2017,2018,2019,2020'
          - group: fy2021-2027
            years: '2021,2022,2023,2024,2025,2026,2027'
    name: Compression / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CANDIDATE_YEARS: '${{ matrix.years }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bound all 34 PUBLIC archive observations to 3 disjoint 128-KiB ranges
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fy2027_archive_compression_probe.py \
            --live-public-samples \
            --years "$CANDIDATE_YEARS" \
            --max-window-bytes 131072
          # Per-job: <=10 years * 3 ranges * 128 KiB; no raw bytes
          # printed, retained, uploaded or catalog-promoted.
