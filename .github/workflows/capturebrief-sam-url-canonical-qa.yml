name: CaptureBrief SAM notice URL source-integrity QA
on:
  pull_request:
    paths:
      - 'scripts/pilot_preflight.py'
      - 'tests/test_pilot_official_url_canonical.py'
      - '.github/workflows/capturebrief-sam-url-canonical-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-url-canonical:
    name: Official source URL canonical / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out exact proposed commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile source validator
        run: python -m py_compile scripts/pilot_preflight.py
      - name: Reject altered official SAM.gov URL strings on both runners
        run: python -m unittest tests.test_pilot_official_url_canonical -v
