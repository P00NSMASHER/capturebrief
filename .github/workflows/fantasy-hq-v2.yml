name: Fantasy HQ v2 CI
on:
  push:
    branches:
      - feature/fantasy-hq-v2-*
    paths:
      - 'fantasy/**'
      - '.github/workflows/fantasy-hq-v2.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'fantasy/**'
      - '.github/workflows/fantasy-hq-v2.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify source syntax
        run: |
          node --version
          node --check fantasy/assets/engine.mjs
          node --check fantasy/assets/app-v2.mjs
          node --check fantasy/assets/coach-engine.mjs
          node --check fantasy/assets/edge-engine.mjs
          node --check fantasy/assets/strategy-engine.mjs
          node --check fantasy/assets/strategic-widgets.mjs
          node --check fantasy/assets/edge-view.mjs
          node --check fantasy/assets/league-branding.mjs
          node --check fantasy/assets/snapshot-import.mjs
          node --check fantasy/adapter/flaim-private-v3.mjs
      - name: Run fail-closed data and UI regression tests
        run: node --test fantasy/tests/*.test.mjs
      - name: Render home and all deep links with headless Chrome
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No browser executable available to verify the page"
            exit 1
          fi
          ln -s . capturebrief
          python3 -m http.server 8797 >/tmp/fantasy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          for path in "" brock/; do
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=14000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/$path" > /tmp/fantasy-render.html 2>/tmp/chrome-stderr.log || {
              cat /tmp/chrome-stderr.log; exit 1;
            }
            grep -Eq 'PUBLISHED AUTO CAPTURE|PUBLISHED SNAPSHOT' /tmp/fantasy-render.html || {
              echo "::error::App failed to load snapshot at $path"; tail -c 1500 /tmp/fantasy-render.html; exit 1;
            }
            if [ -z "$path" ]; then
              grep -Fq 'Brock Hard' /tmp/fantasy-render.html
              if grep -Fq 'Update your Yahoo data' /tmp/fantasy-render.html; then
                grep -Fq 'Import updated Yahoo snapshot' /tmp/fantasy-render.html
                if grep -Eq 'Season 2026 .* Week 4|5th of 8|1–2' /tmp/fantasy-render.html; then
                  echo '::error::Archived Week 4 data was displayed as current'; exit 1;
                fi
              else
                grep -Fq 'class="teamhero' /tmp/fantasy-render.html || { echo '::error::No current team hero or archived explanation'; exit 1; }
                grep -Fq 'BROCK HARD' /tmp/fantasy-render.html
              fi
              if grep -Fq 'class="tabs"' /tmp/fantasy-render.html; then echo '::error::Duplicate top tabs'; exit 1; fi
              if grep -Eq 'Quick Snap Jamison|Highlight Reel Jamison|THREE LEAGUES|All teams' /tmp/fantasy-render.html; then
                echo "::error::Other personal team leaked into Brock-only dashboard"; exit 1;
              fi
              # Source notices differ correctly for archived versus fresh captures.
              if ! grep -Eq 'Outdated fantasy data|Data source notice' /tmp/fantasy-render.html; then
                echo "::error::Expected freshness/provenance notice absent on home page"
                tail -c 2000 /tmp/fantasy-render.html
                exit 1
              fi
            else
              grep -Fq 'Waiver' /tmp/fantasy-render.html
              grep -Fq 'Overview' /tmp/fantasy-render.html
            fi
            echo "Browser smoke passed: /fantasy/$path"
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=14000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/tests/browser-fixture.html" > /tmp/fantasy-fixture.html 2>/tmp/chrome-stderr.log
          grep -Fq 'MAXIMIZED PROJECTED POINTS' /tmp/fantasy-fixture.html || { echo '::error::Projected lineup failed to render'; tail -c 1800 /tmp/fantasy-fixture.html; exit 1; }
          grep -Fq 'Fictional WR Bench' /tmp/fantasy-fixture.html || { echo '::error::Bench slot optimizer failed to render'; exit 1; }
          echo 'Browser smoke passed: synthetic projections and optimizer'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=20000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/tests/import-browser-fixture.html" > /tmp/fantasy-import-qa.html 2>/tmp/chrome-stderr.log
          if ! grep -Fq 'BROWSER_IMPORT_PASS' /tmp/fantasy-import-qa.html; then
            echo "::error::Brock private JSON browser import failed"
            grep -o 'BROWSER_IMPORT_FAIL[^<]*' /tmp/fantasy-import-qa.html || true
            exit 1
          fi
          echo 'Browser smoke passed: archived to Brock-private import'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=20000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/tests/auto-refresh-browser.html" > /tmp/auto-browser.html 2>/tmp/chrome-stderr.log
          if ! grep -Fq 'AUTO_REFRESH_PASS' /tmp/auto-browser.html; then
            echo "::error::Automatic published snapshot supersession failed"
            grep -o 'AUTO_REFRESH_FAIL[^<]*' /tmp/auto-browser.html || true
            exit 1
          fi
          echo 'Browser smoke passed: automatically prefer newer published capture'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=22000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/tests/premium-browser.html" > /tmp/fantasy-premium-qa.html 2>/tmp/chrome-stderr.log
          if ! grep -Fq 'PREMIUM_BROWSER_PASS' /tmp/fantasy-premium-qa.html; then
            echo "::error::Premium Brock Hard mobile UI acceptance failed"
            grep -o 'PREMIUM_BROWSER_FAIL[^<]*' /tmp/fantasy-premium-qa.html || true
            exit 1
          fi
          echo 'Browser smoke passed: eight club crests, mobile navigation, waiver filters, lineup and privacy'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=20000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/tests/coach-archive-browser.html" > /tmp/coach-archive-browser.html 2>/tmp/chrome-stderr.log
          if ! grep -Fq 'COACH_ARCHIVE_PASS' /tmp/coach-archive-browser.html; then
            echo "::error::Archived Yahoo Coach recap was unavailable or displayed stale actions"
            grep -o 'COACH_ARCHIVE_FAIL[^<]*' /tmp/coach-archive-browser.html || true
            exit 1
          fi
          echo 'Browser smoke passed: archived Coach 3-paragraph recap without actionable advice'
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=26000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/tests/strategy-browser.html" > /tmp/strategy-browser.html 2>/tmp/chrome-stderr.log
          if ! grep -Fq 'STRATEGY_BROWSER_PASS' /tmp/strategy-browser.html; then
            echo "::error::Brock four-tab strategic intelligence acceptance failed"
            grep -o 'STRATEGY_BROWSER_FAIL[^<]*' /tmp/strategy-browser.html || true
            exit 1
          fi
          echo 'Browser smoke passed: predictive Home, Lineup, Players, League and Coach navigation'

          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=25000 --window-size=390,844 --dump-dom "http://127.0.0.1:8797/capturebrief/fantasy/tests/edge-aging-browser.html" > /tmp/fantasy-edge-aging.html 2>/tmp/chrome-stderr.log
          if ! grep -Fq 'EDGE_AGING_PASS' /tmp/fantasy-edge-aging.html; then
            echo "::error::Aging Yahoo provider was presented as currently actionable or AI research failed"
            grep -o 'EDGE_AGING_FAIL[^<]*' /tmp/fantasy-edge-aging.html || true
            exit 1
          fi
          echo 'Browser smoke passed: independently verified forecast research with no stale Yahoo waiver claims'



          mkdir -p fantasy/screenshots
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=26000 --window-size=390,844 --screenshot=fantasy/screenshots/strategy-mobile.png "http://127.0.0.1:8797/capturebrief/fantasy/tests/strategy-browser.html" >/dev/null 2>/tmp/chrome-stderr.log
          test -s fantasy/screenshots/strategy-mobile.png

          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=12000 --window-size=390,844 --screenshot=fantasy/screenshots/home.png "http://127.0.0.1:8797/capturebrief/fantasy/" >/dev/null 2>/tmp/chrome-stderr.log
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=12000 --window-size=390,844 --screenshot=fantasy/screenshots/brock.png "http://127.0.0.1:8797/capturebrief/fantasy/brock/" >/dev/null 2>/tmp/chrome-stderr.log
          test -s fantasy/screenshots/home.png
          test -s fantasy/screenshots/brock.png
          for tab in lineup waivers lab coach; do
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=12000 --window-size=390,844 --screenshot="fantasy/screenshots/$tab.png" "http://127.0.0.1:8797/capturebrief/fantasy/#$tab" >/dev/null 2>/tmp/chrome-stderr.log
            test -s "fantasy/screenshots/$tab.png"
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --virtual-time-budget=12000 --window-size=1280,800 --screenshot=fantasy/screenshots/home-desktop.png "http://127.0.0.1:8797/capturebrief/fantasy/" >/dev/null 2>/tmp/chrome-stderr.log
          test -s fantasy/screenshots/home-desktop.png

      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-hq-v2-mobile-preview
          path: fantasy/screenshots/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-hq-v2-site-files
          path: fantasy/
          retention-days: 7
